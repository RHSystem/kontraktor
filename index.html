<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zui Kontraktor – Aplikasi Kontraktor</title>
<meta name="theme-color" content="#1B2333">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEEA;--surface:#FBFBF8;--ink:#1B2333;--muted:#5E6676;--line:#D5D9D1;--soft:#E3E7DF;
  --accent:#F2B01E;--onaccent:#1B2333;--pos:#2B7A4B;--neg:#B63F2E;--info:#2A5A9C;--warn:#8F6200;
  --side:#1B2333;--sideink:#E8EBF0;--sidemuted:#98A1B3;
  --f-head:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141922;--surface:#1C2330;--ink:#E8ECF2;--muted:#9AA3B3;--line:#2D3647;--soft:#252D3C;
    --pos:#5DC088;--neg:#E8826F;--info:#82ADE3;--warn:#E5B24A;--side:#0F131A;
  }
}
:root[data-theme="dark"]{
  --bg:#141922;--surface:#1C2330;--ink:#E8ECF2;--muted:#9AA3B3;--line:#2D3647;--soft:#252D3C;
  --pos:#5DC088;--neg:#E8826F;--info:#82ADE3;--warn:#E5B24A;--side:#0F131A;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);font-weight:700;margin:0;letter-spacing:.2px;line-height:1.1}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}

/* layout */
.side{display:none}
.mtop{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}
.brand{font-family:var(--f-head);font-weight:700;font-size:26px;display:flex;align-items:center;gap:8px;text-decoration:none}
.brand i{width:14px;height:14px;background:var(--accent);display:inline-block;border-radius:2px;transform:rotate(45deg)}
.main{padding:8px 16px 104px}
#view{max-width:1040px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 7px;font-size:11.5px;color:var(--muted);text-decoration:none;border-top:3px solid transparent}
.tabbar a[aria-current="page"]{color:var(--ink);font-weight:600;border-top-color:var(--accent)}
@media (min-width:860px){
  .mtop,.tabbar{display:none}
  .side{display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:232px;background:var(--side);color:var(--sideink);padding:24px 14px}
  .side .brand{font-size:30px;padding:0 10px 22px;color:#fff}
  .side nav{display:flex;flex-direction:column;gap:2px}
  .side a.nl{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:6px;text-decoration:none;color:var(--sidemuted);font-weight:500}
  .side a.nl:hover{background:rgba(255,255,255,.06);color:#fff}
  .side a.nl[aria-current="page"]{background:rgba(242,176,30,.14);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
  .side .grow{flex:1}
  .main{margin-left:232px;padding:30px 40px 60px}
}

/* page head with measuring tape */
.pagehead{margin:14px 0 18px}
.pagehead .row1{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.pagehead h1{font-size:38px}
.pagehead .sub{color:var(--muted);font-size:14px;margin-top:2px}
.tape{height:12px;border-radius:2px;background:
  repeating-linear-gradient(90deg,var(--onaccent) 0 1.5px,transparent 1.5px 40px) left bottom/100% 12px no-repeat,
  repeating-linear-gradient(90deg,var(--onaccent) 0 1px,transparent 1px 8px) left bottom/100% 6px no-repeat,
  var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:8px 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn.primary:hover{filter:brightness(.96)}
.btn.danger{color:var(--neg)}
.btn.sm{min-height:34px;padding:4px 11px;font-size:14px}
.btn.block{width:100%}
.icon-btn{background:none;border:0;padding:8px;border-radius:6px;cursor:pointer;color:var(--muted);display:inline-flex}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.seg{display:inline-flex;max-width:100%;border:1px solid var(--line);border-radius:6px;overflow-x:auto;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px;white-space:nowrap;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
select,input,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-height:42px}
textarea{min-height:84px;resize:vertical}
.filters select{width:auto;min-width:130px}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--accent)}
label.f{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:12px}
label.f>span{display:block;margin-bottom:4px}
label.f input,label.f select,label.f textarea{color:var(--ink);font-weight:400;font-size:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
@media (max-width:520px){.g3{grid-template-columns:1fr 1fr}}
.check{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:500}

/* data surfaces (ledger rows, not cards) */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel+.panel,.section{margin-top:18px}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;gap:8px}
.ph h2{font-size:23px}
.list>.item,.list>a.item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.list>.item:hover{background:var(--soft)}
.item .main2{flex:1;min-width:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:600;text-align:right;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.empty{padding:26px 16px;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--pos)}.chip.bad{color:var(--neg)}.chip.info{color:var(--info)}.chip.warn{color:var(--warn)}.chip.mute{color:var(--muted)}
.bar{height:7px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.over>i{background:var(--neg)}

/* metrics strip */
.metrics{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.metrics>div{padding:14px 16px;border-top:1px solid var(--line)}
.metrics>div:nth-child(-n+2){border-top:0}
.metrics>div:nth-child(even){border-left:1px solid var(--line)}
.metrics .k{font-size:13.5px;color:var(--muted)}
.metrics .v{font-family:var(--f-head);font-weight:700;font-size:28px;line-height:1.15;margin-top:2px}
@media (min-width:760px){
  .metrics{grid-template-columns:repeat(4,1fr)}
  .metrics>div{border-top:0!important;border-left:1px solid var(--line)!important}
  .metrics>div:first-child{border-left:0!important}
}
.cols{display:grid;gap:18px}
@media (min-width:900px){.cols.two{grid-template-columns:1.2fr 1fr}.cols.three{grid-template-columns:repeat(3,1fr);align-items:start}}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding:6px 16px 0}
.chart .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;min-width:0}
.chart .bars{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.chart .bars i{display:block;width:42%;max-width:26px;border-radius:2px 2px 0 0;min-height:2px}
.chart .bi{background:var(--pos)}.chart .bo{background:var(--accent)}
.chart small{color:var(--muted);font-size:12px}
.legend{display:flex;gap:16px;padding:8px 16px 14px;font-size:13px;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:500}
.cat{padding:9px 16px;border-top:1px solid var(--line)}
.cat .r{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:5px}

/* kanban */
.kan h3{font-size:20px;padding:12px 16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.kan h3 span{color:var(--muted);font-family:var(--f-body);font-weight:500;font-size:15px}
.task{padding:12px 16px;border-top:1px solid var(--line)}
.kan h3+.task{border-top:0}
.task .t{font-weight:600}
.task .s{font-size:13.5px;color:var(--muted);margin:2px 0 8px}
.task .late{color:var(--neg);font-weight:600}
.task .bt{display:flex;gap:6px;flex-wrap:wrap}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.55);z-index:95;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-height:94%;display:flex;flex-direction:column;border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
.sheet-h h2{font-size:26px}
.sheet-b{padding:4px 16px 20px;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{width:560px;border-radius:12px;max-height:90%}.sheet.wide{width:860px}}
.btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.btns.start{justify-content:flex-start}

/* document editor */
.items-h{display:flex;justify-content:space-between;align-items:center;margin:6px 0 8px}
.items-h h3{font-size:20px}
.lineitem{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--bg)}
.lineitem .nums{display:grid;grid-template-columns:.8fr .8fr 1.6fr;gap:8px;margin-top:8px}
.lineitem .foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.lineitem .foot b{font-variant-numeric:tabular-nums}
.totals{margin:10px 0 14px;border-top:2px solid var(--ink);padding-top:8px}
.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals .grand{font-family:var(--f-head);font-size:26px;font-weight:700;margin-top:4px}

/* preview / print */
#preview{position:fixed;inset:0;background:#6b7280;z-index:60;overflow:auto}
#preview[hidden]{display:none}
.pv-bar{position:sticky;top:0;display:flex;gap:8px;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--side);color:#fff;flex-wrap:wrap}
.pv-bar .btn{min-height:38px}
.sheetdoc{background:#fff;color:#1B2333;width:min(794px,100%);margin:16px auto;padding:0 0 28px;font-size:13.5px;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.sheetdoc .tape{border-radius:0;height:14px;background:
  repeating-linear-gradient(90deg,#1B2333 0 1.5px,transparent 1.5px 40px) left bottom/100% 14px no-repeat,
  repeating-linear-gradient(90deg,#1B2333 0 1px,transparent 1px 8px) left bottom/100% 7px no-repeat,#F2B01E}
.sd-in{padding:22px 28px 0}
.sd-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sd-co{display:flex;gap:12px;align-items:flex-start}
.sd-co img{max-height:58px;max-width:120px;object-fit:contain}
.sd-co h2{font-size:24px}
.sd-co p{margin:2px 0 0;color:#4a5262;font-size:12.5px;white-space:pre-line}
.sd-title{text-align:right}
.sd-title h1{font-size:40px;letter-spacing:1px}
.sd-title div{font-size:13px;margin-top:2px}
.sd-meta{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0 14px;padding:12px 0;border-top:1px solid #d5d9d1;border-bottom:1px solid #d5d9d1}
.sd-meta small{display:block;color:#5E6676;font-size:12px}
.sd-meta p{margin:2px 0;white-space:pre-line}
.sheetdoc table{width:100%;border-collapse:collapse;margin-top:6px}
.sheetdoc th{background:#1B2333;color:#fff;text-align:left;padding:7px 8px;font-size:12.5px;font-weight:600}
.sheetdoc td{padding:7px 8px;border-bottom:1px solid #e1e4dd;vertical-align:top}
.sheetdoc .r{text-align:right;font-variant-numeric:tabular-nums}.sheetdoc .c{text-align:center;width:30px}
.sd-tot{margin:12px 0 0 auto;width:min(320px,100%)}
.sd-tot div{display:flex;justify-content:space-between;padding:3px 8px}
.sd-tot .g{background:#F2B01E;font-weight:700;font-size:15.5px;padding:8px;margin-top:4px}
.sd-say{margin:12px 0;font-style:italic;color:#4a5262}
.sd-foot{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-top:18px}
.sd-foot h4{margin:0 0 4px;font-size:12.5px;color:#5E6676}
.sd-foot p{margin:0;white-space:pre-line}
.sd-sign{text-align:center}.sd-sign .sp{height:70px}
.sd-sign b{border-top:1px solid #1B2333;display:inline-block;padding-top:3px;min-width:150px}
@media print{
  :root{padding:0!important}
  body>*:not(#preview){display:none!important}
  body{background:#fff}
  #preview{position:static!important;background:#fff;overflow:visible}
  .pv-bar{display:none!important}
  .sheetdoc{box-shadow:none;margin:0;width:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:12mm}
}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
@media (min-width:860px){#toast{bottom:28px}}
.scrollx{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 12px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal;min-width:150px}
.tbl th{font-weight:600;color:var(--muted);font-size:13px;border-top:0}
.tbl tfoot td{font-weight:700;background:var(--soft)}
.rc-box{margin:20px 0 14px;border:1px solid #d5d9d1}
.rc-row{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:10px 12px;border-bottom:1px solid #e1e4dd}
.rc-row:last-child{border-bottom:0}
.rc-row small{color:#5E6676;font-size:12px}
.rc-amt{display:inline-block;background:#F2B01E;font-family:var(--f-head);font-size:30px;font-weight:700;padding:6px 18px;margin:4px 0 10px}
.sd-two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px}
#auth{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:24px 16px 48px}
#auth[hidden]{display:none}
.authcard{width:min(440px,100%);margin-top:4vh}
.authcard .toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.authcard .toprow select{width:auto;min-height:36px;padding:4px 8px}
.authcard h1{font-size:40px;margin:16px 0 4px}
.authcard .seg{margin:14px 0 16px}
.autherr{color:var(--neg);font-weight:600;min-height:22px;margin:8px 0}
.authcard .small{font-size:13.5px}
.flow-step{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.flow-step .dot{flex:none;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border:2px solid var(--line);color:var(--muted)}
.flow-step.done .dot{background:var(--pos);border-color:var(--pos);color:#fff}
.flow-step.cur .dot{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.flow-step.bad .dot{background:var(--neg);border-color:var(--neg);color:#fff}
.flow-step.lock{opacity:.6}
.flow-step .bt{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#auth.land{display:block;padding:0}
.land{max-width:1040px;margin:0 auto;padding:14px 18px 56px}
.land .lhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0 12px}
.land .nav{display:flex;gap:8px;align-items:center}
.land .nav select{width:auto;min-height:38px;padding:4px 8px}
.land .hero{display:grid;gap:28px;padding:26px 0 6px}
@media(min-width:880px){.land .hero{grid-template-columns:1.15fr .85fr;align-items:center;padding-top:44px}}
.land h1{font-size:clamp(40px,8vw,66px);line-height:1;margin:14px 0 0}
.land .eyebrow{font-weight:600;color:var(--muted);font-size:14.5px;margin-top:22px}
.land .lead{font-size:18px;color:var(--muted);max-width:52ch;margin:16px 0 22px;line-height:1.5}
.land .cta{display:flex;gap:10px;flex-wrap:wrap}
.land .note{color:var(--muted);font-size:13.5px;margin-top:12px}
.land section{margin-top:56px}
.land h2{font-size:clamp(30px,5vw,38px);margin-bottom:6px}
.land .sub{color:var(--muted);margin:0 0 20px;max-width:62ch}
.land .feats{display:grid;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
@media(min-width:760px){.land .feats{grid-template-columns:1fr 1fr}.land .feat:nth-child(2){border-top:0}.land .feat:nth-child(even){border-left:1px solid var(--line)}}
.land .feat{display:flex;gap:14px;padding:18px;border-top:1px solid var(--line)}
.land .feat:first-child{border-top:0}
.land .feat svg{flex:none;margin-top:2px}
.land .feat b{display:block;font-size:16.5px;margin-bottom:3px}
.land .feat span{color:var(--muted);font-size:14.5px}
.land .plans{display:grid;gap:14px}
@media(min-width:880px){.land .plans{grid-template-columns:repeat(3,1fr)}}
.land .plan{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:22px;display:flex;flex-direction:column}
.land .plan.pop{border:2px solid var(--accent)}
.land .plan .price{font-family:var(--f-head);font-weight:700;font-size:40px;line-height:1.1;margin:12px 0 2px}
.land .plan .price small{font-size:16px;font-weight:500;color:var(--muted);margin-left:4px}
.land .plan ul{list-style:none;margin:16px 0 20px;padding:0;display:grid;gap:9px;flex:1}
.land .plan li{display:flex;gap:9px;font-size:15px}
.land .plan li::before{content:"✓";color:var(--pos);font-weight:700}
.land details{border-top:1px solid var(--line);padding:14px 2px}
.land details:last-of-type{border-bottom:1px solid var(--line)}

  projects:[],tasks:[],tx:[],quotes:[],invoices:[],vendors:[],bills:[],catalog:[],workers:[],att:[],payroll:[],clients:[],surveys:[],daily:[],po:[],mmove:[],changes:[],kasbon:[],cnotes:[],cnt:{}});
const COLLS=['projects','tasks','tx','quotes','invoices','vendors','bills','catalog','workers','att','payroll','clients','surveys','daily','po','mmove','changes','kasbon','cnotes'];
const SB_OK=!!(window.firebase&&FB_CFG.apiKey&&FB_CFG.projectId&&!/^ISI|YOUR/i.test(FB_CFG.apiKey));
const SB=SB_OK?fbClient(FB_CFG):null;
/* ============ Penghubung Firebase (Auth + Firestore) dengan antarmuka mirip Supabase ============ */
function fbClient(cfg){
  const app=firebase.initializeApp(cfg),auth=firebase.auth(),db=firebase.firestore();
  const FV=firebase.firestore.FieldValue,now=()=>FV.serverTimestamp();
  const lower=s=>String(s||'').trim().toLowerCase();
  const U=u=>u?{id:u.uid,email:u.email||'',user_metadata:{full_name:u.displayName||''},identities:[1]}:null;
  const verified=u=>!!u&&(u.emailVerified||(u.providerData||[]).some(p=>p&&p.providerId==='google.com'));
  const ERR={'auth/invalid-credential':'Invalid login credentials','auth/wrong-password':'Invalid login credentials','auth/user-not-found':'Invalid login credentials','auth/invalid-login-credentials':'Invalid login credentials','auth/email-already-in-use':'User already registered','auth/too-many-requests':'Too many requests','auth/invalid-email':'Invalid email','auth/weak-password':'Password should be at least 8 characters','auth/requires-recent-login':'RECENT_LOGIN','auth/network-request-failed':'Failed to fetch','auth/popup-closed-by-user':'POPUP_CLOSED','permission-denied':'PERMISSION'};
  const fail=e=>({data:null,error:{message:ERR[e&&e.code]||(e&&e.message)||String(e),code:e&&e.code}});
  const co=cid=>db.collection('companies').doc(cid);
  const rid=(c,i)=>c+'~'+i;

  /* ---- auth ---- */
  let first=true,lastUid=null;const subs=[];
  const ready=new Promise(res=>{auth.onAuthStateChanged(u=>{
    const v=verified(u)?u.uid:null;
    if(first){first=false;lastUid=v;res();return}
    if(v&&v!==lastUid)subs.forEach(f=>f('SIGNED_IN',{user:U(u)}));
    else if(!v&&lastUid)subs.forEach(f=>f('SIGNED_OUT',null));
    lastUid=v;
  })});
  const A={
    async getSession(){await ready;const u=auth.currentUser;if(u&&!verified(u)){try{await u.reload()}catch(e){}}return{data:{session:verified(u)?{user:U(u)}:null}}},
    async getUser(){await ready;const u=auth.currentUser;return{data:{user:verified(u)?U(u):null}}},
    onAuthStateChange(f){subs.push(f);return{data:{subscription:{unsubscribe(){const i=subs.indexOf(f);if(i>=0)subs.splice(i,1)}}}}},
    async signInWithPassword({email,password}){
      try{const c=await auth.signInWithEmailAndPassword(email,password);await c.user.reload();
        if(!verified(auth.currentUser))return{data:null,error:{message:'Email not confirmed'}};
        lastUid=c.user.uid;return{data:{user:U(c.user),session:{user:U(c.user)}},error:null}}catch(e){return fail(e)}
    },
    async signUp({email,password,options}){
      try{const c=await auth.createUserWithEmailAndPassword(email,password);
        const nm=options&&options.data&&options.data.full_name;if(nm)await c.user.updateProfile({displayName:nm});
        await c.user.sendEmailVerification({url:(options&&options.emailRedirectTo)||location.href});
        return{data:{user:U(c.user),session:null},error:null}}catch(e){return fail(e)}
    },
    async resend({email}){
      const u=auth.currentUser;
      if(!u||lower(u.email)!==lower(email))return{error:{message:'Masuk dulu dengan email dan kata sandi, lalu tekan Kirim ulang email.'}};
      try{await u.sendEmailVerification({url:location.href});return{error:null}}catch(e){return fail(e)}
    },
    async resetPasswordForEmail(email){try{await auth.sendPasswordResetEmail(email);return{error:null}}catch(e){return fail(e)}},
    async updateUser(o){
      const u=auth.currentUser;if(!u)return{data:null,error:{message:'Not signed in'}};
      try{if(o.password)await u.updatePassword(o.password);if(o.data&&'full_name' in o.data)await u.updateProfile({displayName:o.data.full_name});return{data:{user:U(auth.currentUser)},error:null}}catch(e){return fail(e)}
    },
    async signInWithOAuth(){
      const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
      try{await auth.signInWithPopup(p);return{error:null}}
      catch(e){if(/popup-blocked|operation-not-supported|web-storage/.test(e&&e.code||'')){try{await auth.signInWithRedirect(p);return{error:null}}catch(x){return fail(x)}}if(e&&e.code==='auth/popup-closed-by-user')return{error:null};return fail(e)}
    },
    async signOut(){lastUid=null;await auth.signOut();return{error:null}}
  };

  /* ---- data ---- */
  const ALL={};
  async function cascadeDeleteCompany(cid){
    const recs=await co(cid).collection('records').get();
    for(let i=0;i<recs.docs.length;i+=400){const b=db.batch();recs.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}
    const [mem,inv]=await Promise.all([co(cid).collection('members').get(),co(cid).collection('invites').get()]);
    const b=db.batch(),me=auth.currentUser.uid;
    inv.docs.forEach(d=>{b.delete(d.ref);b.delete(db.collection('invites').doc(d.id).collection('companies').doc(cid))});
    mem.docs.forEach(d=>{if(d.id!==me){b.delete(db.collection('users').doc(d.id).collection('companies').doc(cid));b.delete(d.ref)}});
    await b.commit();
    const b2=db.batch();b2.delete(db.collection('users').doc(me).collection('companies').doc(cid));b2.delete(co(cid).collection('members').doc(me));b2.delete(co(cid));await b2.commit();
  }
  async function run(q){
    const f=q.f,me=auth.currentUser;
    if(q.t==='records'){
      const cid=f.company_id||(Array.isArray(q.v)&&q.v[0]&&q.v[0].company_id);if(!cid)throw{message:'Missing company'};const col=co(cid).collection('records');
      if(q.op==='select'){
        const from=q.range?q.range[0]:0,to=q.range?q.range[1]:1e9;
        if(from===0||!ALL[cid]){const s=await col.get();ALL[cid]=s.docs.map(d=>{const x=d.data();let data=null;try{data=JSON.parse(x.j)}catch(e){}return{coll:x.coll,id:x.id,data}}).filter(r=>r.data)}
        return ALL[cid].slice(from,to+1);
      }
      if(q.op==='upsert'){
        const b=db.batch();let big=0;
        for(const r of q.v){const j=JSON.stringify(r.data);if(j.length>1000000){big++;continue}b.set(col.doc(rid(r.coll,r.id)),{coll:r.coll,id:r.id,j,u:now()})}
        await b.commit();if(big)throw{message:'DOC_TOO_BIG'};return[];
      }
      if(q.op==='delete'){const b=db.batch();(f.id_in||[]).forEach(i=>b.delete(col.doc(rid(f.coll,i))));await b.commit();return[]}
    }
    if(q.t==='members'){
      if(q.op==='select'&&f.user_id&&!f.company_id){
        const s=await db.collection('users').doc(f.user_id).collection('companies').get(),out=[];
        await Promise.all(s.docs.map(async d=>{const cid=d.id;try{const [c,m]=await Promise.all([co(cid).get(),co(cid).collection('members').doc(f.user_id).get()]);if(c.exists&&m.exists)out.push({company_id:cid,role:m.data().role,companies:{name:c.data().name||''},_t:(m.data().created_at&&m.data().created_at.toMillis&&m.data().created_at.toMillis())||0});else d.ref.delete().catch(()=>{})}catch(e){}}));
        return out.sort((a,b)=>a._t-b._t);
      }
      if(q.op==='select'){const s=await co(f.company_id).collection('members').get();return s.docs.map(d=>{const x=d.data();return{user_id:d.id,role:x.role,email:x.email||'',display_name:x.display_name||'',_t:(x.created_at&&x.created_at.toMillis&&x.created_at.toMillis())||0}}).sort((a,b)=>a._t-b._t)}
      if(q.op==='delete'){const b=db.batch();b.delete(db.collection('users').doc(f.user_id).collection('companies').doc(f.company_id));b.delete(co(f.company_id).collection('members').doc(f.user_id));await b.commit();return[]}
      if(q.op==='update'){const b=db.batch();b.update(co(f.company_id).collection('members').doc(f.user_id),{role:q.v.role});b.set(db.collection('users').doc(f.user_id).collection('companies').doc(f.company_id),{role:q.v.role},{merge:true});await b.commit();return[]}
    }
    if(q.t==='invites'){
      if(q.op==='select'){const s=await co(f.company_id).collection('invites').get();return s.docs.map(d=>({id:f.company_id+'|'+d.id,email:d.id,role:d.data().role}))}
      if(q.op==='delete'){const [cid,email]=String(f.id).split('|');const b=db.batch();b.delete(co(cid).collection('invites').doc(email));b.delete(db.collection('invites').doc(email).collection('companies').doc(cid));await b.commit();return[]}
    }
    if(q.t==='companies'){
      if(q.op==='update'){await co(f.id).update({name:q.v.name});return[]}
      if(q.op==='delete'){await cascadeDeleteCompany(f.id);return[]}
    }
    throw{message:'Unsupported query '+q.t+'/'+q.op};
  }
  function from(t){
    const q={t,op:'select',f:{},v:null,range:null};
    const b={
      select(){return b},order(){return b},limit(){return b},single(){return b},maybeSingle(){return b},
      eq(k,v){q.f[k]=v;return b},in(k,v){q.f[k+'_in']=v;return b},range(a,z){q.range=[a,z];return b},
      upsert(v){q.op='upsert';q.v=v;return b},update(v){q.op='update';q.v=v;return b},delete(){q.op='delete';return b},insert(v){q.op='insert';q.v=v;return b},
      then(res,rej){return run(q).then(data=>({data,error:null}),e=>fail(e)).then(res,rej)}
    };return b;
  }

  /* ---- fungsi server (pengganti RPC Supabase) ---- */
  const allowed=email=>{const l=(cfg.allowedCreators||window.MANDOR_CONFIG&&window.MANDOR_CONFIG.allowedCreators||[]).map(lower);return !l.length||l.includes(lower(email))};
  const RPC={
    async can_create_company(){const u=auth.currentUser;return !!u&&allowed(u.email)},
    async create_company({p_name}){
      const u=auth.currentUser;if(!u)throw{message:'Not signed in'};if(!allowed(u.email))throw{message:'NOT_ALLOWED'};
      const ref=db.collection('companies').doc(),b=db.batch();
      b.set(ref,{name:p_name||'Perusahaan',owner:u.uid,created_at:now()});
      b.set(ref.collection('members').doc(u.uid),{user_id:u.uid,role:'owner',email:lower(u.email),display_name:u.displayName||'',created_at:now()});
      b.set(db.collection('users').doc(u.uid).collection('companies').doc(ref.id),{role:'owner',created_at:now()});
      await b.commit();return ref.id;
    },
    async claim_invites(){
      const u=auth.currentUser;if(!u||!u.email)return 0;const em=lower(u.email);
      const s=await db.collection('invites').doc(em).collection('companies').get();let n=0;
      for(const d of s.docs){const cid=d.id,inv=d.data();
        try{const m=await co(cid).collection('members').doc(u.uid).get();const b=db.batch();
          if(!m.exists){b.set(co(cid).collection('members').doc(u.uid),{user_id:u.uid,role:inv.role,email:em,display_name:u.displayName||'',created_at:now()});b.set(db.collection('users').doc(u.uid).collection('companies').doc(cid),{role:inv.role,created_at:now()})}
          b.delete(d.ref);b.delete(co(cid).collection('invites').doc(em));await b.commit();n++}catch(e){}}
      return n;
    },
    async invite_member({p_company,p_email,p_role}){
      const em=lower(p_email);if(!/^\S+@\S+\.\S+$/.test(em))throw{message:'Invalid email'};
      const c=await co(p_company).get(),b=db.batch();
      b.set(db.collection('invites').doc(em).collection('companies').doc(p_company),{company_id:p_company,company_name:(c.exists&&c.data().name)||'',role:p_role,email:em,created_at:now()});
      b.set(co(p_company).collection('invites').doc(em),{email:em,role:p_role,created_at:now()});
      await b.commit();return true;
    },
    async set_display_name({p_company,p_name}){const u=auth.currentUser;if(!u||!p_company)return;await co(p_company).collection('members').doc(u.uid).update({display_name:p_name||''})}
  };
  async function rpc(n,args){if(!RPC[n])return{data:null,error:{message:'Unknown function '+n}};try{return{data:await RPC[n](args||{}),error:null}}catch(e){return fail(e)}}

  /* ---- realtime ---- */
  function channel(){
    const ch={cb:null,cid:null,un:null,
      on(_e,opt,cb){ch.cb=cb;const m=/company_id=eq\.(.+)$/.exec((opt&&opt.filter)||'');ch.cid=m&&m[1];return ch},
      subscribe(){if(!ch.cid)return ch;let init=true;
        ch.un=co(ch.cid).collection('records').onSnapshot(s=>{if(init){init=false;return}
          s.docChanges().forEach(c=>{if(c.doc.metadata.hasPendingWrites)return;const x=c.doc.data();
            if(c.type==='removed')ch.cb({eventType:'DELETE',old:{coll:x.coll,id:x.id}});
            else{let data=null;try{data=JSON.parse(x.j)}catch(e){return}ch.cb({eventType:c.type==='added'?'INSERT':'UPDATE',new:{coll:x.coll,id:x.id,data}})}})},()=>{});
        return ch}};
    return ch;
  }
  function removeChannel(ch){try{ch&&ch.un&&ch.un()}catch(e){}}

  return{auth:A,from,rpc,channel,removeChannel,_fb:{app,auth,db}};
}

const REDIRECT=location.origin+location.pathname;
let S=null,USER=null,COMPANY=null,COMPANIES=[],ROLE='viewer',CHAN=null,SNAP=new Map();
let dirty=false,pushing=false,saveT=null,SYNC='ok',ENTERING=false,AUTHTAB='login',AUTHNOTE='',AUTHPRE='',hiddenAt=0,rT=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ROLES={owner:'Pemilik',admin:'Admin',staff:'Staf',viewer:'Hanya lihat'};
const MGR=()=>ROLE==='owner'||ROLE==='admin';
function stable(v){if(v===null||typeof v!=='object')return JSON.stringify(v);if(Array.isArray(v))return '['+v.map(stable).join(',')+']';return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}'}
function collectLocal(){
  const m=new Map();
  COLLS.forEach(c=>(S[c]||[]).forEach(e=>{if(e&&e.id)m.set(c+'/'+e.id,{coll:c,id:e.id,data:e,json:stable(e)})}));
  m.set('meta/settings',{coll:'meta',id:'settings',data:S.settings,json:stable(S.settings)});
  m.set('meta/cnt',{coll:'meta',id:'cnt',data:S.cnt||{},json:stable(S.cnt||{})});
  return m;
}
async function pullAll(){
  const rows=[];let from=0;
  for(;;){
    const {data,error}=await SB.from('records').select('coll,id,data').eq('company_id',COMPANY.id).order('seq',{ascending:true}).range(from,from+999);
    if(error)throw error;rows.push(...(data||[]));if(!data||data.length<1000)break;from+=1000;
  }
  const d=defaults();SNAP=new Map();
  rows.forEach(r=>{
    SNAP.set(r.coll+'/'+r.id,stable(r.data));
    if(r.coll==='meta'){if(r.id==='settings')d.settings=Object.assign(d.settings,r.data);else if(r.id==='cnt')d.cnt=r.data||{}}
    else if(COLLS.includes(r.coll))d[r.coll].push(r.data);
  });
  return d;
}
function setSync(st){
  SYNC=st;const el=$('#sync');if(!el)return;
  if(S&&(OFFLINE||!navigator.onLine)){el.hidden=false;el.className='off';el.textContent=(dirty||st!=='ok')?_tr('Offline – perubahan tersimpan di HP'):_tr('Offline');return}
  if(st==='ok'){el.hidden=true;return}
  el.hidden=false;el.className=st==='error'?'err':'';el.textContent=st==='error'?_tr('Gagal menyimpan, mencoba lagi…'):_tr('Menyimpan…');
}
function save(){
  if(!S||!COMPANY||ROLE==='viewer')return;
  ensureClients();
  dirty=true;clearTimeout(saveT);saveT=setTimeout(push,600);setSync('saving');cacheSoon();if(typeof schedPub==='function')schedPub();
}
const flush=()=>push();
async function push(){
  if(pushing||!dirty||!COMPANY||!S||ROLE==='viewer')return;
  pushing=true;dirty=false;
  try{
    const cur=collectLocal(),up=[],del={};
    for(const [k,v] of cur)if(SNAP.get(k)!==v.json)up.push([k,v]);
    for(const k of SNAP.keys())if(!cur.has(k)){const i=k.indexOf('/');(del[k.slice(0,i)]=del[k.slice(0,i)]||[]).push(k.slice(i+1))}
    for(let i=0;i<up.length;i+=100){
      const ch=up.slice(i,i+100);
      const {error}=await SB.from('records').upsert(ch.map(([k,v])=>({company_id:COMPANY.id,coll:v.coll,id:v.id,data:v.data})),{onConflict:'company_id,coll,id'});
      if(error)throw error;ch.forEach(([k,v])=>SNAP.set(k,v.json));
    }
    for(const c of Object.keys(del)){
      for(let i=0;i<del[c].length;i+=100){
        const ids=del[c].slice(i,i+100);
        const {error}=await SB.from('records').delete().eq('company_id',COMPANY.id).eq('coll',c).in('id',ids);
        if(error)throw error;ids.forEach(id=>SNAP.delete(c+'/'+id));
      }
    }
    setSync(dirty?'saving':'ok');cacheSoon();
  }catch(e){dirty=true;setSync('error');clearTimeout(saveT);saveT=setTimeout(push,6000)}
  finally{pushing=false;if(dirty&&SYNC!=='error'){clearTimeout(saveT);saveT=setTimeout(push,300)}}
}
window.addEventListener('beforeunload',e=>{if((dirty||pushing)&&!CACHED){e.preventDefault();e.returnValue=''}});
function unsub(){try{if(CHAN&&SB)SB.removeChannel(CHAN)}catch(e){}CHAN=null;if(typeof stopShares==='function')stopShares();if(typeof stopWorkers==='function')stopWorkers()}
function subscribe(){
  unsub();
  CHAN=SB.channel('rec-'+COMPANY.id).on('postgres_changes',{event:'*',schema:'public',table:'records',filter:'company_id=eq.'+COMPANY.id},onRemote).subscribe();
}
function scheduleRender(){clearTimeout(rT);rT=setTimeout(()=>{if(S){if(typeof ensureShares==='function')ensureShares();if(typeof ensureWorkers==='function')ensureWorkers();render()}},250);cacheSoon()}
function onRemote(p){
  if(!S)return;
  const r=p.eventType==='DELETE'?p.old:p.new;if(!r||!r.coll)return;
  const k=r.coll+'/'+r.id;
  if(p.eventType==='DELETE'){
    if(!SNAP.has(k))return;SNAP.delete(k);
    if(r.coll!=='meta')S[r.coll]=(S[r.coll]||[]).filter(e=>e.id!==r.id);
  }else{
    const j=stable(r.data);if(SNAP.get(k)===j)return;SNAP.set(k,j);
    if(r.coll==='meta'){if(r.id==='settings')S.settings=Object.assign(defaults().settings,r.data);else if(r.id==='cnt')S.cnt=r.data||{}}
    else if(COLLS.includes(r.coll)){const arr=S[r.coll]=S[r.coll]||[],i=arr.findIndex(e=>e.id===r.id);if(i>=0)arr[i]=r.data;else arr.push(r.data)}
  }
  scheduleRender();
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){hiddenAt=Date.now();return}
  if(S&&COMPANY&&!dirty&&!pushing&&Date.now()-hiddenAt>30000)pullAll().then(d=>{S=d;render()}).catch(()=>{});
});
function errMsg(e){
  const m=String((e&&e.message)||e||'');
  if(/Invalid login credentials/i.test(m))return _tr('Email atau kata sandi salah');
  if(/Email not confirmed/i.test(m))return _tr('Email belum diverifikasi. Cek kotak masuk (dan folder spam) atau kirim ulang.');
  if(/already registered|already been registered/i.test(m))return _tr('Email ini sudah terdaftar');
  if(/rate limit|too many/i.test(m))return _tr('Terlalu banyak permintaan, coba lagi sebentar lagi');
  if(/valid email|invalid email/i.test(m))return _tr('Email tidak valid');
  if(/Password should be/i.test(m))return _tr('Kata sandi minimal 8 karakter');
  if(/PERMISSION|insufficient permissions/i.test(m))return _tr('Akses ditolak. Pastikan aturan keamanan Firestore sudah dipasang sesuai panduan.');
  if(/RECENT_LOGIN/.test(m))return _tr('Demi keamanan, keluar lalu masuk lagi sebelum mengganti kata sandi.');
  if(/NOT_ALLOWED/.test(m))return _tr('Akun ini belum diizinkan membuat perusahaan. Minta undangan dari pemilik perusahaan.');
  if(/DOC_TOO_BIG/.test(m))return _tr('Data terlalu besar untuk disimpan (biasanya foto). Kurangi foto di laporan harian.');
  if(/POPUP_CLOSED/.test(m))return _tr('Jendela masuk Google ditutup.');
  if(/client is offline|unavailable/i.test(m))return _tr('Tidak ada koneksi internet');
  if(/company creation not allowed/i.test(m))return _tr('Hanya pemilik yang bisa membuat perusahaan baru. Minta diundang oleh pemilik perusahaan.');
  if(/fetch|network|Failed to/i.test(m))return _tr('Gagal terhubung ke server. Periksa koneksi internet.');
  return m||_tr('Terjadi kesalahan. Coba lagi.');
}
function applyRO(){
  document.querySelectorAll('#view form[data-form="settings"] input,#view form[data-form="settings"] select,#view form[data-form="settings"] textarea').forEach(e=>{e.disabled=true});
  const v=$('#view');if(v&&v.insertAdjacentHTML)v.insertAdjacentHTML('afterbegin',`<div class="rohint">${_tr('Mode hanya lihat: kamu bisa melihat data tetapi tidak bisa mengubahnya.')}</div>`);
}
function startApp(){zr();setTimeout(instShow,0);
  document.documentElement.classList.toggle('ro',ROLE==='viewer');
  $('#auth').hidden=true;$('#auth').innerHTML='';document.documentElement.lang=LANG;
  if(!location.hash||/access_token|refresh_token|type=|error/.test(location.hash))history.replaceState(null,'',location.pathname+location.search+'#beranda');

function onAuth(ev,session){

async function enterApp(){
  if(ENTERING)return;ENTERING=true;
  try{
    const u=await SB.auth.getUser();USER=(u&&u.data&&u.data.user)||USER;
    try{await SB.rpc('claim_invites')}catch(e){}
    const {data:ms,error}=await SB.from('members').select('company_id,role,companies(name)').eq('user_id',USER.id);
    if(error)throw error;
    COMPANIES=ms||[];
    if(!COMPANIES.length){showCompanySetup();return}
    let last=null;try{last=localStorage.getItem('mandor-co-'+USER.id)}catch(e){}
    await openCompany(COMPANIES.find(x=>x.company_id===last)||COMPANIES[0]);

  finally{ENTERING=false}

  if(ensureClients()&&ROLE!=='viewer')save();

function docTotals(d){
  const sub=sumBy(d.items||[],i=>(+i.qty||0)*(+i.price||0));
  const disc=Math.min(+d.discount||0,sub),base=sub-disc;
  const tax=d.ppn?base*(+d.ppnRate||0)/100:0;
  return{sub,disc,base,tax,total:base+tax};
}
const paid=v=>sumBy(v.payments||[],p=>p.amount);
const balance=v=>Math.max(0,docTotals(v).total-pphAmt(v)-paid(v));
function invState(v){

  if(v.status==='draft'&&p===0)return 'Draft';
  if(v.dueDate&&v.dueDate<todayStr())return 'Jatuh tempo';
  return p>0?'Sebagian':'Terkirim';
}
function pStats(p){

}

function taskCard(x){

function buildNav(){

function render(){
  if(!S)return;
  const [name,arg]=(location.hash||'#beranda').slice(1).split('/');
  let h;
  switch(name){
    case 'proyek':h=arg?viewProyekDetail(arg):viewProyek();break;
    case 'tugas':h=viewTugas();break;
    case 'keuangan':h=viewKeuangan();break;
    case 'dokumen':h=viewDokumen();break;
    case 'pengaturan':h=viewPengaturan();break;
    default:h=viewBeranda();
  }

function buildReceiptPdf(r){
  const rp=n=>moneyPdf(n,r.cur);
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a5',orientation:'landscape'});
  const s=S.settings,W=210,M=14,R=W-M;
  const ink=()=>doc.setTextColor(27,35,51),gray=()=>doc.setTextColor(94,102,118);
  doc.setFillColor(242,176,30);doc.rect(0,0,W,4,'F');
  let y=13,x=M;
  if(s.logo){try{const pr=doc.getImageProperties(s.logo),q=pr.width/pr.height;let h=14,w=h*q;if(w>32){w=32;h=w/q}doc.addImage(s.logo,'PNG',M,y-2,w,h);x=M+w+4}catch(e){}}
  ink();doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text(s.company,x,y+3);
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);gray();
  const co=[s.address,[s.phone,s.email].filter(Boolean).join(' · ')].filter(Boolean).join('\n');
  doc.text(doc.splitTextToSize(co,95-(x-M)),x,y+8);
  ink();doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text(r.title,R,y+4,{align:'right'});
  doc.setFontSize(9.5);doc.text(r.no,R,y+10,{align:'right'});doc.setFont('helvetica','normal');gray();doc.text(_tr('Tanggal: ')+fmtD(r.date),R,y+15,{align:'right'});
  y=40;doc.setDrawColor(213,217,209);doc.setLineWidth(.3);doc.line(M,y-4,R,y-4);

const CLIENT_PAY_CATS=['Pembayaran klien','Uang muka / DP'];
const normName=n=>String(n||'').trim().toLowerCase().replace(/\s+/g,' ');
function hash36(x){let h=5381;for(let i=0;i<x.length;i++)h=((h<<5)+h+x.charCodeAt(i))|0;return (h>>>0).toString(36)}
function ensureClients(){
  if(!S)return false;
  if(!Array.isArray(S.clients))S.clients=[];
  let changed=false;const byName=new Map(S.clients.map(c=>[normName(c.name),c]));
  [...S.projects,...S.quotes,...S.invoices].forEach(r=>{
    const n=normName(r.client);
    if(!n){if(r.clientId){r.clientId='';changed=true}return}
    let c=byName.get(n);
    if(!c){
      c={id:'cl'+hash36(n),name:String(r.client).trim(),company:'',phone:r.clientPhone||r.phone||'',email:'',address:r.clientAddress||'',notes:''};
      if(S.clients.some(x=>x.id===c.id))c.id+=uid().slice(0,3);

}

const canOverride=()=>typeof MGR==='function'?MGR():true;

const projSurveys=pid=>(S.surveys||[]).filter(x=>x.projectId===pid).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
const hasDoneSurvey=pid=>(S.surveys||[]).some(x=>x.projectId===pid&&x.status==='done');
const approvedQuote=pid=>S.quotes.find(q=>q.projectId===pid&&q.status==='approved');
const roomArea=r=>(+r.l||0)*(+r.w||0);
const roomWall=r=>2*((+r.l||0)+(+r.w||0))*(+r.h||0);
const svTotals=s=>({floor:sumBy(s.rooms||[],roomArea),wall:sumBy(s.rooms||[],roomWall)});
function projStage(p){
  if(p.status!=='prospect')return '';
  const sv=projSurveys(p.id),qs=S.quotes.filter(q=>q.projectId===p.id);
  if(qs.some(q=>q.status==='approved'))return 'approved';
  if(qs.some(q=>q.status==='sent'))return 'waiting';
  if(qs.length&&qs.every(q=>q.status==='rejected'))return 'rejected';
  if(qs.some(q=>q.status==='draft'))return 'quoting';
  if(sv.some(x=>x.status==='done')||p.skipSurvey)return 'ready';
  if(sv.some(x=>x.status==='scheduled'))return 'visit-scheduled';
  return 'need-visit';
}
function stageInfo(code){
  const m={'need-visit':['Perlu site visit','warn'],'visit-scheduled':['Site visit dijadwalkan','info'],'ready':['Siap dibuat penawaran','info'],'quoting':['Menyusun penawaran','mute'],'waiting':['Menunggu persetujuan klien','warn'],'approved':['Disetujui','ok'],'rejected':['Penawaran ditolak','bad']}[code];

function gateQuote(pid){

  const s2=qs.length?step(2,_tr('Penawaran harga'),q.status==='approved'?'done':q.status==='rejected'?'bad':'cur',`${esc(q.number)} · ${rpd(docTotals(q).total,q)} · ${qst}`,B('doc-open',_tr('Lihat'),`data-kind="quote" data-id="${q.id}"`))

function buildPdf(kind,d){
  const rp=n=>moneyPdf(n,dcur(d));
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  const s=S.settings,T=docTotals(d),isQ=kind==='quote',pd=paid(d),W=210,M=15,R=W-M;
  const txt=(t,x,y,o)=>doc.text(String(t),x,y,o);
  const fs=n=>doc.setFontSize(n),bold=()=>doc.setFont('helvetica','bold'),norm=()=>doc.setFont('helvetica','normal'),ital=()=>doc.setFont('helvetica','italic');
  const gray=()=>doc.setTextColor(94,102,118),ink=()=>doc.setTextColor(27,35,51);
  doc.setFillColor(242,176,30);doc.rect(0,0,W,5,'F');
  let y=15,x=M;
  if(s.logo){try{const pr=doc.getImageProperties(s.logo),r=pr.width/pr.height;let h=16,w=h*r;if(w>36){w=36;h=w/r}doc.addImage(s.logo,'PNG',M,y-3,w,h);x=M+w+4}catch(e){}}
  ink();bold();fs(15);txt(s.company,x,y+3);
  norm();fs(9);gray();
  const co=[s.address,[s.phone,s.email].filter(Boolean).join(' · '),s.npwp?'NPWP '+s.npwp:''].filter(Boolean).join('\n');
  const cl=doc.splitTextToSize(co,100-(x-M));txt(cl,x,y+8);
  const leftEnd=y+8+cl.length*4;
  ink();bold();fs(22);txt(isQ?_tr('PENAWARAN'):_tr('INVOICE'),R,y+4,{align:'right'});
  fs(10);txt(d.number,R,y+11,{align:'right'});
  norm();fs(9);gray();
  txt(_tr('Tanggal: ')+fmtD(d.date),R,y+16,{align:'right'});
  txt((isQ?_tr('Berlaku s.d.: ')+fmtD(d.validUntil):_tr('Jatuh tempo: ')+fmtD(d.dueDate)),R,y+20.5,{align:'right'});
  y=Math.max(leftEnd,y+24)+4;
  doc.setDrawColor(213,217,209);doc.setLineWidth(.3);doc.line(M,y,R,y);y+=6;
  gray();fs(8.5);txt(isQ?_tr('Kepada'):_tr('Ditagihkan kepada'),M,y);txt(_tr('Perihal'),112,y);
  ink();bold();fs(10.5);txt(d.client||'-',M,y+5);
  const pt=doc.splitTextToSize(d.title||'-',R-112);txt(pt,112,y+5);
  norm();fs(9);gray();
  const ad=doc.splitTextToSize([d.clientAddress,d.clientPhone].filter(Boolean).join('\n')||' ',90);txt(ad,M,y+10);
  let my=y+10+ad.length*4;
  if(d.projectId){txt(_tr('Proyek terkait: ')+projName(d.projectId),112,y+5+pt.length*4.8)}
  y=Math.max(my,y+5+pt.length*4.8+5)+3;
  doc.line(M,y,R,y);y+=4;
  // tabel
  const cx={no:M,desc:M+11,qty:M+104,unit:M+107,price:M+138,tot:R};
  const head=()=>{doc.setFillColor(27,35,51);doc.rect(M,y,R-M,7,'F');doc.setTextColor(255,255,255);bold();fs(8.5);
    txt(_tr('No'),M+2,y+4.8);txt(_tr('Uraian'),cx.desc,y+4.8);txt(_tr('Jml'),cx.qty,y+4.8,{align:'right'});txt(_tr('Sat'),cx.unit,y+4.8);txt(_tr('Harga satuan'),cx.price,y+4.8,{align:'right'});txt(_tr('Jumlah'),cx.tot-1.5,y+4.8,{align:'right'});y+=7;norm();fs(9);ink()};
  head();
  d.items.forEach((it,i)=>{
    const dl=doc.splitTextToSize(it.desc,90),h=dl.length*4.1+3.4;
    if(y+h>278){doc.addPage();y=15;head()}
    ink();norm();fs(9);
    txt(i+1,M+5.5,y+4.6,{align:'center'});txt(dl,cx.desc,y+4.6);
    txt(fmtQty(it.qty),cx.qty,y+4.6,{align:'right'});txt(it.unit||'',cx.unit,y+4.6);
    txt(rp(it.price),cx.price,y+4.6,{align:'right'});txt(rp((+it.qty||0)*(+it.price||0)),cx.tot-1.5,y+4.6,{align:'right'});
    y+=h;doc.setDrawColor(225,228,221);doc.line(M,y,R,y);
  });
  y+=6;
  // total
  const rows=[['Subtotal',rp(T.sub)]];
  if(T.disc)rows.push([_tr('Diskon'),'-'+rp(T.disc)]);
  if(T.tax)rows.push([_tr('PPN ')+d.ppnRate+'%',rp(T.tax)]);
  if(y+rows.length*5+30>280){doc.addPage();y=15}
  ink();norm();fs(9.5);
  rows.forEach(r=>{txt(r[0],128,y);txt(r[1],R-1.5,y,{align:'right'});y+=5});
  doc.setFillColor(242,176,30);doc.rect(124,y-3.5,R-124,8,'F');bold();fs(11);ink();
  txt(_tr('Total'),128,y+1.8);txt(rp(T.total),R-1.5,y+1.8,{align:'right'});y+=9;
  if(!isQ&&d.pph){norm();fs(9.5);txt(_tr('PPh dipotong ')+d.pphRate+'%',128,y);txt('-'+rp(pphAmt(d)),R-1.5,y,{align:'right'});y+=5;bold();txt(_tr('Dibayar klien'),128,y);txt(rp(netDue(d)),R-1.5,y,{align:'right'});y+=6}
  if(!isQ&&pd>0){norm();fs(9.5);txt(_tr('Sudah dibayar'),128,y);txt('-'+rp(pd),R-1.5,y,{align:'right'});y+=5;bold();txt(_tr('Sisa tagihan'),128,y);txt(rp(balance(d)),R-1.5,y,{align:'right'});y+=5}
  y+=3;ital();fs(9);gray();
  const tb=doc.splitTextToSize(_tr('Terbilang: ')+terbilang(!isQ&&pd>0?balance(d):(!isQ?netDue(d):T.total),dcur(d)),R-M);txt(tb,M,y);y+=tb.length*4.2+6;
  // catatan, rekening, tanda tangan
  const nl=d.notes?doc.splitTextToSize(d.notes,105):[],bl=(!isQ&&s.bank)?doc.splitTextToSize(s.bank,105):[];
  const need=Math.max(40,(nl.length+bl.length)*4.2+16);
  if(y+need>285){doc.addPage();y=15}
  let ly=y;
  if(nl.length){gray();bold();fs(8.5);txt(isQ?_tr('Syarat & ketentuan'):_tr('Catatan'),M,ly);norm();fs(9);ink();txt(nl,M,ly+4.5);ly+=nl.length*4.2+8}
  if(bl.length){gray();bold();fs(8.5);txt(_tr('Pembayaran ke'),M,ly);norm();fs(9);ink();txt(bl,M,ly+4.5)}
  norm();fs(9);ink();txt(_tr('Hormat kami,'),160,y,{align:'center'});
  doc.setDrawColor(27,35,51);doc.line(138,y+26,182,y+26);bold();txt(s.owner||s.company,160,y+30,{align:'center'});
  if(isQ&&d.sign){let sy=Math.max(ly+6,y+40);if(sy+36>290){doc.addPage();sy=15}norm();fs(9);ink();txt(_tr('Disetujui oleh klien,'),45,sy,{align:'center'});try{const pr=doc.getImageProperties(d.sign.img),r=pr.width/pr.height;let h=18,w=h*r;if(w>60){w=60;h=w/r}doc.addImage(d.sign.img,'PNG',45-w/2,sy+3,w,h)}catch(e){}doc.setDrawColor(27,35,51);doc.line(23,sy+24,67,sy+24);bold();txt(d.sign.name,45,sy+28,{align:'center'});norm();fs(8);gray();txt(fmtD(d.sign.date),45,sy+32,{align:'center'})}
  return doc.output('blob');
}

function waInfo(kind,d){
  const rp=n=>rpd(n,d);
  const s=S.settings,T=docTotals(d);let m;
  if(kind==='quote')m=_h`Yth. ${d.client},\n\nBerikut penawaran ${d.number}${d.title?_tr(' untuk ')+d.title:''} senilai ${rp(T.total)}. Berlaku sampai ${fmtD(d.validUntil)}.\n\nTerima kasih,\n${s.company}`;
  else m=_h`Yth. ${d.client},\n\nBerikut tagihan ${d.number}${d.title?_tr(' untuk ')+d.title:''}.\nSisa tagihan: ${rp(balance(d))}\nJatuh tempo: ${fmtD(d.dueDate)}\n${s.bank?'\nPembayaran ke:\n'+s.bank+'\n':''}\nTerima kasih,\n${s.company}`;
  let ph=(d.clientPhone||'').replace(/[^\d]/g,'');if(ph.startsWith('0'))ph='62'+ph.slice(1);

function syncPayTx(inv,pay){

}

  if(S&&ROLE==='viewer'&&!t.dataset.flt){toast(_tr('Peranmu hanya bisa melihat data'));if(t.type==='file')t.value='';return}
  if(t.dataset&&t.dataset.set==='currency'){S.settings.currency=t.value;save();render();toast(_tr('Mata uang diubah'));return}
  if('catpick' in t.dataset&&ED){const c=S.catalog.find(x=>x.id===t.value);if(c){const it={desc:c.name,qty:1,unit:c.unit||'ls',price:c.price},blank=ED.items.length===1&&!ED.items[0].desc&&!ED.items[0].price;if(blank)ED.items=[it];else ED.items.push(it);renderItems();refreshTotals()}t.value='';return}

  const form=t.form;

function shrinkImg(file,max=900,q=.6){

}

function applyKasbon(pr,ded){
  const net=rnd(pr.amount-ded),k=pr.amount>0?net/pr.amount:0,txs=S.tx.filter(t=>t.payrollId===pr.id);let acc=0;
  txs.forEach((t,i)=>{t.amount=i===txs.length-1?rnd(net-acc):rnd(t.amount*k);acc+=i===txs.length-1?0:t.amount;t.desc+=_tr(' (dipotong kasbon)')});
  S.tx=S.tx.filter(t=>!(t.payrollId===pr.id&&!(t.amount>0)));
  let left=ded;kbOpen(pr.workerId).forEach(kb=>{if(left<=0.5)return;const a=Math.min(left,kbBal(kb));kb.deds=kb.deds||[];kb.deds.push({payId:pr.id,date:pr.date,amount:a});left=rnd(left-a)});
  pr.gross=pr.amount;pr.kasbon=ded;pr.amount=net;
}

const dnum=s=>{const [y,m,d]=(s||'').split('-').map(Number);return Date.UTC(y,(m||1)-1,d||1)/864e5};
const dstr=n=>{const t=new Date(n*864e5);return t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0')+'-'+String(t.getUTCDate()).padStart(2,'0')};
const clamp01=x=>Math.max(0,Math.min(1,x));

/* ---------- Jadwal & kurva S ---------- */
function logProg(p){
  if(!p||ROLE==='viewer')return;
  const v=physProgress(p),t=todayStr(),l=p.progLog||(p.progLog=[]),last=l[l.length-1];
  if(last&&last.v===v)return;
  if(last&&last.d===t)last.v=v;else l.push({d:t,v});
  if(l.length>400)l.splice(0,l.length-400);
  save();
}
function planAt(p,d){
  const x=dnum(d),it=(p.rabItems||[]).filter(i=>(+i.qty||0)*(+i.price||0)>0),ps=p.start?dnum(p.start):null,pe=p.end?dnum(p.end):null;
  const lin=(s,e)=>e>s?clamp01((x-s)/(e-s)):(x>=e?1:0);
  if(it.length&&it.some(i=>i.start&&i.end)){
    const tot=sumBy(it,i=>i.qty*i.price);
    return sumBy(it,i=>{const s=i.start?dnum(i.start):ps,e=i.end?dnum(i.end):pe;if(s==null||e==null)return 0;return i.qty*i.price*lin(s,e)})/tot*100;
  }
  if(ps==null||pe==null)return null;
  const f=lin(ps,pe);return (f*f*(3-2*f))*100;
}
function schedState(p){
  if(!p.start||!p.end)return null;
  const t=todayStr(),pl=planAt(p,t),ac=physProgress(p),dev=Math.round(ac-pl);
  if(ac>=100)return{pl,ac,dev,label:'Selesai',tone:'ok'};
  if(dev>=-5)return{pl,ac,dev,label:'Sesuai jadwal',tone:'ok'};
  if(dev>=-15)return{pl,ac,dev,label:'Sedikit terlambat',tone:'warn'};
  return{pl,ac,dev,label:'Terlambat jadwal',tone:'bad'};
}
function sCurveSvg(p){
  const s=dnum(p.start),e=dnum(p.end),t=dnum(todayStr()),lo=s,hi=Math.max(e,Math.min(t,e+Math.max(14,(e-s)*.3)));
  const W=320,H=150,X=v=>((v-lo)/Math.max(1,hi-lo)*W).toFixed(1),Y=v=>(H-v/100*H).toFixed(1);
  let plan='';for(let i=0;i<=48;i++){const x=lo+(hi-lo)*i/48;plan+=(i?'L':'M')+X(x)+' '+Y(planAt(p,dstr(Math.round(x))))}
  const log=(p.progLog||[]).filter(r=>dnum(r.d)>=lo);const pts=[[s,0],...log.map(r=>[dnum(r.d),r.v])];if(t>s&&t<=hi)pts.push([t,physProgress(p)]);
  const act=pts.sort((a,b)=>a[0]-b[0]).map((q,i)=>(i?'L':'M')+X(q[0])+' '+Y(q[1])).join('');
  const grid=[25,50,75,100].map(v=>`<line x1="0" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" class="sg-g"/><text x="${W-2}" y="${+Y(v)-3}" class="sg-t" text-anchor="end">${v}%</text>`).join('');
  return `<svg viewBox="-4 -8 ${W+8} ${H+26}" class="scurve" role="img" aria-label="${esc(_tr('Kurva S rencana dan realisasi'))}">${grid}<line x1="0" x2="${W}" y1="${H}" y2="${H}" class="sg-a"/>${e<=hi?`<line x1="${X(e)}" x2="${X(e)}" y1="0" y2="${H}" class="sg-e"/>`:''}${t>=lo&&t<=hi?`<line x1="${X(t)}" x2="${X(t)}" y1="0" y2="${H}" class="sg-n"/><text x="${X(t)}" y="${H+12}" class="sg-t" text-anchor="middle">${esc(_tr('Hari ini'))}</text>`:''}<path d="${plan}" class="sg-p"/><path d="${act}" class="sg-r"/><text x="0" y="${H+12}" class="sg-t">${esc(fmtD(p.start))}</text>${e<=hi&&X(e)>60?`<text x="${X(e)}" y="${H+22}" class="sg-t" text-anchor="middle">${esc(fmtD(p.end))}</text>`:''}</svg>`;
}
function schedulePanel(p){
  if(!p.start||!p.end)return _h`<div class="panel section"><div class="ph"><h2>Jadwal &amp; kurva S</h2><button class="btn sm" data-act="edit-project" data-id="${p.id}">${ic('edit',16)}Isi tanggal</button></div><div class="empty" style="border-top:1px solid var(--line)">Isi tanggal mulai dan selesai proyek untuk melihat kurva S rencana vs realisasi.</div></div>`;
  const st=schedState(p),it=(p.rabItems||[]).filter(i=>i.start&&i.end),s=dnum(p.start),e=Math.max(dnum(p.end),...it.map(i=>dnum(i.end))),span=Math.max(1,e-s);
  const gantt=it.length?_h`<div class="subh">Jadwal pekerjaan</div><div class="gantt">${it.slice().sort((a,b)=>a.start.localeCompare(b.start)).map(i=>{const l=(dnum(i.start)-s)/span*100,w=Math.max(2,(dnum(i.end)-dnum(i.start))/span*100),late=(+i.progress||0)<100&&i.end<todayStr();return _h`<div class="gr"><div class="gl">${esc(i.desc)}<small>${fmtD(i.start)} – ${fmtD(i.end)} · ${fmtQty(i.progress||0)}%</small></div><div class="gb"><i class="${late?'late':''}" style="left:${l}%;width:${w}%"><b style="width:${Math.min(100,+i.progress||0)}%"></b></i></div></div>`}).join('')}</div>`:'';
  return _h`<div class="panel section"><div class="ph"><h2>Jadwal &amp; kurva S</h2>${chip(st.label,st.tone)}</div>
  <div style="padding:12px 16px 4px"><div class="g3 sm3"><div><small class="muted">Rencana hari ini</small><div class="num"><b>${Math.round(st.pl)}%</b></div></div><div><small class="muted">Realisasi</small><div class="num"><b>${st.ac}%</b></div></div><div><small class="muted">Selisih</small><div class="num ${st.dev<-5?'neg':'pos'}"><b>${st.dev>0?'+':''}${st.dev}%</b></div></div></div>
  ${sCurveSvg(p)}<div class="legend" style="margin:2px 0 8px"><span><b style="background:var(--muted)"></b>Rencana</span><span><b style="background:var(--pos)"></b>Realisasi</span></div>
  <p class="muted" style="font-size:13px;margin:0 0 10px">${it.length?_tr('Rencana dihitung dari tanggal tiap item RAB.'):_tr('Isi tanggal mulai dan selesai di tiap item RAB agar rencana lebih akurat.')} Realisasi diambil dari progres fisik RAB (atau tugas selesai).</p></div>${gantt}</div>`;
}

let SIG=null;
function sigPad(title,name,note,cb){
  SIG={cb,drawn:false};
  modal(title,_h`<p class="muted" style="margin-top:0;font-size:14px">${esc(note||'')}</p>${fld(_tr('Nama penanda tangan'),_h`<input id="sigName" value="${esc(name||'')}" required>`)}
  <div class="sigbox"><canvas id="sigCv"></canvas><span class="sighint">Tanda tangan di sini</span></div>
  <div class="btns"><button type="button" class="btn" data-act="sig-clear" style="margin-right:auto">Ulangi</button><button type="button" class="btn" data-act="close-modal">Batal</button><button type="button" class="btn primary" data-act="sig-ok">Simpan tanda tangan</button></div>`);

function dueItems(){
  if(!S)return[];const t=todayStr(),soon=addDays(t,30),L2=[];
  S.invoices.forEach(v=>{const st=invState(v);if(st!=='Lunas'&&st!=='Draft'&&v.dueDate&&v.dueDate<=soon)L2.push({d:v.dueDate,k:'inv'+v.id,t:_h`${v.number} – ${v.client}`,b:_tr('Sisa ')+rpd(balance(v),v)})});
  S.bills.forEach(b=>{if(billBal(b)>0&&b.due&&b.due<=soon)L2.push({d:b.due,k:'bill'+b.id,t:_h`Bayar ${vName(b.vendorId)||'vendor'}`,b:b.desc+' · '+rp(billBal(b))})});
  S.projects.filter(p=>p.status!=='done').forEach(p=>(p.terms||[]).forEach(x=>{if(!x.invoiceId&&termReady(p,x))L2.push({d:t,k:'term'+x.id,t:_h`${x.name} siap ditagih`,b:p.name})}));
  L('po').forEach(o=>{if(o.need&&o.need<=soon&&poState(o)!=='Diterima')L2.push({d:addDays(o.need,-1),k:'po'+o.id,t:_h`${o.no} belum diterima`,b:projName(o.projectId)+' · '+_tr('dibutuhkan')+' '+fmtD(o.need)})});
  S.projects.forEach(p=>{const e=wEnd(p);if(e&&e>=addDays(t,-30)&&e<=soon)L2.push({d:addDays(e,-7),k:'war'+p.id,t:_h`Garansi ${p.name} berakhir ${fmtD(e)}`,b:_tr('Siapkan penagihan retensi')});(p.claims||[]).filter(c=>c.status!=='done').forEach(c=>L2.push({d:c.date,k:'cl'+c.id,t:_h`Klaim garansi: ${p.name}`,b:c.desc}))});
  S.quotes.forEach(q=>{if(q.status==='sent'&&q.validUntil&&q.validUntil<=soon)L2.push({d:addDays(q.validUntil,-1),k:'q'+q.id,t:_h`${q.number} segera kedaluwarsa`,b:q.client})});
  return L2.sort((a,b)=>a.d.localeCompare(b.d));
}

let OFFLINE=false,CACHED=true,cacheT=null;
const IDB=(()=>{let p=null;const db=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('zui-kontraktor',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=(m,f)=>db().then(d=>new Promise((res,rej)=>{const t=d.transaction('kv',m),s=t.objectStore('kv'),q=f(s);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
  return{get:k=>tx('readonly',s=>s.get(k)),set:(k,v)=>tx('readwrite',s=>s.put(v,k)),clear:()=>tx('readwrite',s=>s.clear())}})();

function collectFrom(o){

  COLLS.forEach(c=>(o[c]||[]).forEach(e=>{if(e&&e.id)m.set(c+'/'+e.id,{coll:c,id:e.id,data:e,json:stable(e)})}));
  if(o.settings)m.set('meta/settings',{coll:'meta',id:'settings',data:o.settings,json:stable(o.settings)});
  m.set('meta/cnt',{coll:'meta',id:'cnt',data:o.cnt||{},json:stable(o.cnt||{})});

}
function mergePending(cache){
  if(!cache||ROLE==='viewer')return 0;
  const cs=new Map(cache.snap||[]),loc=collectFrom(cache.S||{});let n=0;
  for(const [k,v] of loc){if(cs.get(k)===v.json)continue;n++;
    if(v.coll==='meta'){if(v.id==='settings')S.settings=Object.assign(S.settings,v.data);else S.cnt=Object.assign({},S.cnt,v.data)}
    else{const a=S[v.coll]||(S[v.coll]=[]),i=a.findIndex(e=>e.id===v.id);if(i>=0)a[i]=v.data;else a.push(v.data)}}
  for(const k of cs.keys()){if(loc.has(k))continue;const i=k.indexOf('/'),c=k.slice(0,i),id=k.slice(i+1);if(c==='meta'||!S[c])continue;const b=S[c].length;S[c]=S[c].filter(e=>e.id!==id);if(S[c].length!==b)n++}
  return n;
}

const FS=()=>firebase.firestore();
const TSV=()=>firebase.firestore.FieldValue.serverTimestamp();
const shareUrl=t=>location.origin+location.pathname.replace(/[^/]*$/,'')+'klien.html#'+t;
const newToken=()=>{const a=new Uint8Array(20);crypto.getRandomValues(a);return [...a].map(x=>(x%36).toString(36)).join('')+Date.now().toString(36).slice(-4)};
const fnv=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)+s.length.toString(36)};
const tsMs=v=>v&&v.toMillis?v.toMillis():(v&&v.seconds?v.seconds*1000:(typeof v==='number'?v:Date.now()));
let SHL={},SHPUB={},CHAT={},pubT=null,OPENCHAT=null,CHIMG='';
const canChat=()=>ROLE==='owner'||ROLE==='admin'||ROLE==='staff';

/* ---------- data yang dibagikan ke klien (tanpa biaya internal) ---------- */
function shareSnap(p){
  const s=S.settings,st=p.start&&p.end?schedState(p):null,its=it=>(it||[]).map(i=>({d:i.desc||'',q:+i.qty||0,u:i.unit||'',p:+i.price||0}));
  const inv=S.invoices.filter(v=>v.projectId===p.id&&invState(v)!=='Draft').sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(v=>{const T=docTotals(v);return{id:v.id,no:v.number,date:v.date,due:v.dueDate||'',cur:dcur(v),sub:T.sub,disc:T.disc,tax:T.tax,ppnRate:v.ppn?v.ppnRate:0,total:T.total,pph:pphAmt(v),pphRate:v.pph?v.pphRate:0,paid:paid(v),bal:balance(v),state:invState(v),title:v.title||'',items:its(v.items)}});
  const q=S.quotes.filter(x=>x.projectId===p.id&&x.status!=='draft').map(x=>{const T=docTotals(x);return{id:x.id,no:x.number,date:x.date,valid:x.validUntil||'',cur:dcur(x),sub:T.sub,disc:T.disc,tax:T.tax,ppnRate:x.ppn?x.ppnRate:0,total:T.total,status:x.status,title:x.title||'',notes:x.notes||'',sign:x.sign?{name:x.sign.name,date:x.sign.date}:null,items:its(x.items)}});
  const ch=L('changes').filter(x=>x.projectId===p.id&&x.status!=='draft').map(x=>({id:x.id,no:x.no,type:x.type,title:x.title,detail:x.detail||'',amount:+x.amount||0,status:x.status,date:x.date,sign:x.sign?{name:x.sign.name,date:x.sign.date}:null}));
  let curve=null;
  if(p.start&&p.end){const s0=dnum(p.start),e0=dnum(p.end),t0=dnum(todayStr()),hi=Math.max(e0,Math.min(t0,e0+Math.max(14,(e0-s0)*.3))),plan=[];
    for(let i=0;i<=30;i++){const x=s0+(hi-s0)*i/30;plan.push({x:Math.round(x),y:Math.round(planAt(p,dstr(Math.round(x)))*10)/10})}
    const act=[{x:s0,y:0},...(p.progLog||[]).filter(r=>dnum(r.d)>=s0).map(r=>({x:dnum(r.d),y:r.v}))];if(t0>s0)act.push({x:t0,y:physProgress(p)});
    curve={s:s0,e:e0,hi,plan,act:act.sort((a,b)=>a.x-b.x)}}
  const terms=(p.terms||[]).map(t=>{const inv1=t.invoiceId?getDoc('invoice',t.invoiceId):null;return{name:t.name,pct:+t.pct||0,amt:rnd((p.value||0)*(+t.pct||0)/100),state:inv1?invState(inv1):(termReady(p,t)?'Siap ditagih':'Belum ditagih')}});
  return{cid:COMPANY.id,pid:p.id,
    co:{name:s.company||'',logo:s.logo||'',phone:s.phone||'',email:s.email||'',bank:s.bank||'',cur:baseCur(),lang:LANG},
    p:{name:p.name,client:p.client||'',address:p.address||'',start:p.start||'',end:p.end||'',status:p.status,value:+p.value||0,contract:contractNow(p),paid:projPaid(p),remaining:projReceivable(p).remaining},
    prog:{ac:physProgress(p),pl:st?Math.round(st.pl):null,label:st?st.label:'',tone:st?st.tone:''},curve,inv,q,ch,terms,
    ho:p.handover?{date:p.handover.date,days:+p.handover.days||0,wend:wEnd(p),note:p.handover.note||'',sign:p.handover.sign?{name:p.handover.sign.name,date:p.handover.sign.date}:null}:null};
}
function schedPub(){if(!S||!S.projects.some(p=>p.share&&p.share.active))return;clearTimeout(pubT);pubT=setTimeout(publishShares,2500)}
async function publishShares(){
  if(!S||!COMPANY||!canChat()||!navigator.onLine)return;
  for(const p of S.projects){if(p.share&&p.share.active){try{await publishOne(p)}catch(e){}}}
}
async function publishOne(p){
  const t=p.share.token,ref=FS().collection('shares').doc(t);
  let st=SHPUB[t];
  if(!st){const d=await ref.get();if(!d.exists)return;const x=d.data();st=SHPUB[t]={h:x.h||'',dh:x.dh||{}}}
  const snap=shareSnap(p),h=fnv(JSON.stringify(snap)),dh={},ops=[];
  L('daily').filter(x=>x.projectId===p.id).forEach(x=>{const o={date:x.date,weather:x.weather||'',crew:+x.crew||0,work:x.work||'',issues:x.issues||'',photos:x.photos||[]},hh=fnv(JSON.stringify(o));dh[x.id]=hh;if(st.dh[x.id]!==hh)ops.push([x.id,o])});
  Object.keys(st.dh).forEach(id=>{if(!dh[id])ops.push([id,null])});
  if(h===st.h&&!ops.length)return;
  for(const [id,o] of ops){const r=ref.collection('daily').doc(id);if(o)await r.set(o);else await r.delete()}
  await ref.update(Object.assign(snap,{h,dh,u:TSV()}));
  st.h=h;st.dh=dh;
}

/* ---------- membuat & mengatur link ---------- */
async function shareCreate(p){
  if(!MGR())return toast(_tr('Hanya pemilik atau admin yang bisa membuat link klien'));
  if(!navigator.onLine)return toast(_tr('Butuh koneksi internet untuk membuat link'));
  const t=newToken(),ref=FS().collection('shares').doc(t);
  try{await ref.set(Object.assign(shareSnap(p),{active:true,created:TSV(),h:'',dh:{}}))}catch(e){return toast(errMsg(e))}
  p.share={token:t,active:true,created:todayStr()};SHPUB[t]={h:'',dh:{}};save();
  try{await publishOne(p)}catch(e){}
  listenShare(p);render();toast(_tr('Link klien dibuat'));
}
async function shareToggle(p,on){
  if(!MGR())return;
  try{await FS().collection('shares').doc(p.share.token).update({active:on})}catch(e){return toast(errMsg(e))}
  p.share.active=on;save();if(on)schedPub();render();toast(on?_tr('Link klien diaktifkan'):_tr('Link klien dimatikan'));
}
function shareWa(p){
  const s=S.settings,m=_h`Yth. ${p.client||'Bapak/Ibu'},\n\nBerikut link untuk memantau proyek ${p.name}: progres, foto laporan harian, tagihan, dan chat dengan kami.\n\n${shareUrl(p.share.token)}\n\nMohon link ini tidak dibagikan ke orang lain.\n\nTerima kasih,\n${s.company}`;
  openWa(p.phone||(findClient(p.client)||{}).phone,m);
}

/* ---------- mendengarkan chat & persetujuan dari klien ---------- */
function listenShare(p){
  const t=p.share&&p.share.token;if(!t||SHL[t]||!canChat())return;
  const ref=FS().collection('shares').doc(t),pid=p.id;CHAT[pid]=CHAT[pid]||[];
  const u1=ref.collection('msgs').onSnapshot(s=>{CHAT[pid]=s.docs.map(d=>{const x=d.data({serverTimestamps:'estimate'});return{id:d.id,from:x.from,name:x.name||'',text:x.text||'',img:x.img||'',ts:tsMs(x.ts)}}).sort((a,b)=>a.ts-b.ts);chatChanged(pid)},()=>{});
  const u2=ref.collection('acts').onSnapshot(s=>{s.docs.forEach(d=>applyAct(pid,d))},()=>{});
  SHL[t]={un:()=>{try{u1()}catch(e){}try{u2()}catch(e){}},pid};
}
function stopShares(){Object.values(SHL).forEach(x=>x.un());SHL={};SHPUB={};CHAT={};OPENCHAT=null}
function ensureShares(){if(!S||!canChat())return;S.projects.forEach(p=>{if(p.share&&p.share.token&&!SHL[p.share.token])listenShare(p)})}
function applyAct(pid,d){
  if(!S||!canChat())return;const a=d.data()||{},p=S.projects.find(x=>x.id===pid);if(!p)return;
  const sg={img:a.img||'',name:(a.name||'').slice(0,100),date:a.date||todayStr(),via:'link'};let msg='';
  if(a.type==='quote'){const q=getDoc('quote',a.id);if(q&&q.projectId===pid&&!q.sign&&q.status!=='rejected'){q.sign=sg;q.status='approved';try{activateFromQuote(q)}catch(e){}msg=_h`${sg.name} menyetujui penawaran ${q.number}`}}
  else if(a.type==='change'){const x=L('changes').find(y=>y.id===a.id&&y.projectId===pid);if(x&&x.status!=='approved'&&x.status!=='rejected'){x.sign=sg;x.status='approved';x.approvedDate=sg.date;msg=_h`${sg.name} menyetujui ${x.no}`}}
  else if(a.type==='bast'){if(p.handover&&!p.handover.sign){p.handover.sign=sg;msg=_h`${sg.name} menandatangani berita acara ${p.name}`}}
  d.ref.delete().catch(()=>{});
  if(msg){save();render();toast(msg)}
}

const readKey=pid=>'zk-read-'+((USER&&USER.id)||'')+'-'+pid;
const lastRead=pid=>{try{return +localStorage.getItem(readKey(pid))||0}catch(e){return 0}};
const markRead=pid=>{try{localStorage.setItem(readKey(pid),String(Date.now()))}catch(e){}};
const unreadOf=pid=>(CHAT[pid]||[]).filter(m=>m.from==='client'&&m.ts>lastRead(pid)).length;
function chatChanged(pid){if(OPENCHAT===pid&&$('#chatlist')){renderChat();markRead(pid)}else scheduleRender()}

  if(!canChat())return '';
  const sh=p.share;
  if(!sh)return _h`<div class="panel section"><div class="ph"><h2>Halaman klien</h2>${MGR()?_h`<button class="btn sm primary" data-act="share-new" data-id="${p.id}">Buat link klien</button>`:''}</div><div class="cat"><span class="muted" style="font-size:14px">Klien bisa memantau progres, foto laporan, tagihan, menyetujui dokumen, dan chat dengan timmu lewat satu link, tanpa daftar akun. Biaya internal, upah, dan vendor tidak ikut terlihat.${MGR()?'':_tr(' Minta pemilik atau admin membuat link.')}</span></div></div>`;
  const msgs=CHAT[p.id]||[],last=msgs[msgs.length-1],un=unreadOf(p.id),url=shareUrl(sh.token);

    <div class="linkbox"><span>${esc(url)}</span></div>
    <div class="btns start" style="margin-top:10px">
      <button class="btn sm primary" data-act="chat-open" data-id="${p.id}">Chat klien${un?_h` <b class="badge">${un}</b>`:''}</button>
      ${MGR()&&sh.active?_h`<button class="btn sm" data-act="share-wa" data-id="${p.id}">${ic('send',16)}Kirim link</button>`:''}
      <button class="btn sm" data-act="share-copy" data-id="${p.id}">Salin</button>
      <a class="btn sm" href="${esc(url)}" target="_blank" rel="noopener">Lihat sebagai klien</a>
      ${MGR()?_h`<button class="btn sm ${sh.active?'danger':''}" data-act="share-toggle" data-id="${p.id}" data-on="${sh.active?'0':'1'}">${sh.active?_tr('Matikan link'):_tr('Aktifkan lagi')}</button>`:''}
    </div>
    ${last?_h`<div class="lastmsg"><small>${esc(last.from==='client'?last.name||_tr('Klien'):last.name||_tr('Tim'))} · ${fmtTime(last.ts)}</small><div>${esc(last.text||(last.img?_tr('[foto]'):''))}</div></div>`:''}
  </div></div>`;

const fmtTime=ms=>{const d=new Date(ms),t=iso(d);return (t===todayStr()?_tr('Hari ini'):fmtD(t))+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

function renderChat(){

}

function salCalc(f){const v=k=>+(f[k]&&f[k].value)||0;const inc=v('base')+v('allowMeal')+v('allowOther')+v('overtime')+v('bonus'),ded=v('dedBpjs')+v('dedOther'),kb=Math.min(v('kasbon'),Math.max(0,inc-ded));return{inc,ded,kb,net:Math.max(0,inc-ded-kb)}}
function salTotals(){const f=document.querySelector('form[data-form=salary]'),el=$('#saltot');if(!f||!el)return;const c=salCalc(f);el.innerHTML=_h`<div><span>Total pendapatan</span><span class="num">${rp(c.inc)}</span></div><div><span>Total potongan</span><span class="num">-${rp(c.ded+c.kb)}</span></div><div class="grand"><span>Gaji bersih dibayar</span><span class="num">${rp(c.net)}</span></div>`}
document.addEventListener('input',e=>{if(e.target.form&&e.target.form.dataset.form==='salary')salTotals()});
SUB.salary=(f,d)=>{
  const w=wById(f.dataset.w);if(!w)return;const c=salCalc(f),n=k=>+d[k]||0;
  if(c.inc<=0)return toast(_tr('Isi gaji pokok atau pendapatan lain'));
  const pid=uid(),inc=[['Gaji pokok',n('base')],['Tunjangan makan & transport',n('allowMeal')],['Tunjangan lain',n('allowOther')],['Lembur',n('overtime')],['Bonus / THR',n('bonus')]].filter(x=>x[1]>0).map(x=>({n:x[0],a:x[1]}));
  const ded=[['Potongan BPJS',n('dedBpjs')],['Potongan lain',n('dedOther')]].filter(x=>x[1]>0).map(x=>({n:x[0],a:x[1]}));
  const pr={id:pid,kind:'monthly',workerId:w.id,period:d.period,date:d.date,method:d.method,inc,ded,gross:c.inc,dedTotal:c.ded,kasbon:c.kb,amount:c.net,days:S.att.filter(a=>a.workerId===w.id&&a.date.startsWith(d.period)&&(+a.units||0)>0).length,txIds:[]};
  pr.no=nextNo('slipg');
  if(c.net>0){const tid=uid();pr.txIds.push(tid);S.tx.push({id:tid,type:'out',date:d.date,amount:c.net,category:'Upah tenaga kerja',desc:_h`Gaji ${w.name} ${monthLabel(d.period)}`,projectId:d.projectId||'',workerId:w.id,payrollId:pid})}
  let left=c.kb;kbOpen(w.id).forEach(k=>{if(left<=0.5)return;const a=Math.min(left,kbBal(k));k.deds=k.deds||[];k.deds.push({payId:pid,date:d.date,amount:a});left=rnd(left-a)});
  S.payroll.push(pr);save();render();openSalSlip(pid);toast(_tr('Gaji dibayar dan slip dibuat'));
};

function listenW(w){
  const t=w.share&&w.share.token;if(!t||WSL[t]||!canChat())return;
  const ref=FS().collection('wshares').doc(t),wid=w.id,un=[];WQ[wid]=WQ[wid]||{checks:[],reports:[],reqs:[]};
  const rows=s=>s.docs.map(d=>Object.assign({_id:d.id,_ref:d.ref},d.data({serverTimestamps:'estimate'})));
  un.push(ref.collection('msgs').onSnapshot(s=>{WCHAT[wid]=s.docs.map(d=>{const x=d.data({serverTimestamps:'estimate'});return{id:d.id,from:x.from,name:x.name||'',text:x.text||'',img:x.img||'',ts:tsMs(x.ts)}}).sort((a,b)=>a.ts-b.ts);if(OPENWCHAT===wid&&$('#chatlist')){renderWChat();markRead('w'+wid)}else scheduleRender()},()=>{}));
  un.push(ref.collection('checks').onSnapshot(s=>{WQ[wid].checks=rows(s);scheduleRender()},()=>{}));
  un.push(ref.collection('reports').onSnapshot(s=>{WQ[wid].reports=rows(s).filter(r=>r.status==='wait');scheduleRender()},()=>{}));
  un.push(ref.collection('reqs').onSnapshot(s=>{WQ[wid].reqs=rows(s);scheduleRender()},()=>{}));
  un.push(ref.collection('taskups').onSnapshot(s=>{s.docs.forEach(d=>applyTaskUp(wid,d))},()=>{}));
  WSL[t]={un:()=>un.forEach(f=>{try{f()}catch(e){}}),wid};
}

  'req-ok':async el=>{const r=(WQ[el.dataset.w]||{reqs:[]}).reqs.find(x=>x._id===el.dataset.id),w=wById(el.dataset.w);if(!r)return;const note=($('#reqNote')||{}).value||'';
    if(r.type==='kasbon'){if(!MGR())return toast(_tr('Hanya pemilik atau admin yang bisa menyetujui kasbon'));const k={id:uid(),workerId:w.id,date:todayStr(),amount:+r.amount||0,method:'Tunai',projectId:'',note:(r.note||_tr('Pengajuan dari HP')).slice(0,200),deds:[]};S.tx.push({id:uid(),type:'out',date:k.date,amount:k.amount,category:'Upah tenaga kerja',desc:_h`Kasbon ${w.name}${k.note?' – '+k.note:''}`,projectId:'',workerId:w.id,kasbonId:k.id});L('kasbon').push(k)}
    else if(!S.att.find(a=>a.workerId===w.id&&a.date===r.date))S.att.push({id:uid(),workerId:w.id,date:r.date,projectId:'',units:0,rate:0,note:r.type==='sakit'?'Sakit':'Izin'});
    save();closeModal();try{await r._ref.update({status:'ok',reply:note.slice(0,300)})}catch(e){}render();toast(_tr('Pengajuan disetujui'))},
  'req-no':async el=>{const r=(WQ[el.dataset.w]||{reqs:[]}).reqs.find(x=>x._id===el.dataset.id);if(!r)return;const note=($('#reqNote')||{}).value||'';closeModal();try{await r._ref.update({status:'no',reply:note.slice(0,300)})}catch(e){}render();toast(_tr('Pengajuan ditolak'))},
  'geo-set':el=>{const p=S.projects.find(x=>x.id===el.dataset.id);if(!navigator.geolocation)return toast(_tr('HP ini tidak mendukung lokasi'));toast(_tr('Mengambil lokasi…'));
    navigator.geolocation.getCurrentPosition(pos=>{p.geo={lat:+pos.coords.latitude.toFixed(6),lng:+pos.coords.longitude.toFixed(6),r:(p.geo&&p.geo.r)||200,acc:Math.round(pos.coords.accuracy)};save();render();toast(_h`Lokasi proyek disimpan (akurasi ±${Math.round(pos.coords.accuracy)} m)`)},
      err=>toast(_tr('Lokasi tidak bisa diambil. Izinkan akses lokasi di browser.')),{enableHighAccuracy:true,timeout:20000,maximumAge:0})},
  'geo-r':el=>{const p=S.projects.find(x=>x.id===el.dataset.id);modal(_tr('Radius absen'),_h`<form data-form="georad" data-id="${p.id}">${fld(_tr('Radius (meter)'),_h`<input name="r" type="number" min="50" max="5000" step="10" value="${p.geo.r||200}" required>`)}<div class="btns"><button type="button" class="btn" data-act="close-modal">Batal</button><button class="btn primary" type="submit">Simpan</button></div></form>`)},
  'geo-del':el=>{const p=S.projects.find(x=>x.id===el.dataset.id);delete p.geo;save();render()}
});
SUB.georad=(f,d)=>{const p=S.projects.find(x=>x.id===f.dataset.id);p.geo.r=Math.max(50,Math.min(5000,+d.r||200));save();closeModal();render()};
SUB.worker=(f,d)=>{
  const m=d.wtype==='monthly',o={name:d.name.trim(),role:d.role.trim(),phone:d.phone.trim(),rate:m?0:(+d.rate||0),active:!!d.active,type:m?'monthly':'daily'};
  if(m)o.salary={base:+d.base||0,allowMeal:+d.allowMeal||0,allowOther:+d.allowOther||0,dedBpjs:+d.dedBpjs||0,dedOther:+d.dedOther||0};
  if(f.dataset.id)Object.assign(wById(f.dataset.id),o);else{o.id=uid();S.workers.push(o)}
  save();closeModal();render();toast(_tr('Pekerja disimpan'));
};
