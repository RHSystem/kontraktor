<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1B2333">
<title>Halaman Pekerja</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEEEA;--surface:#FBFBF8;--ink:#1B2333;--muted:#5E6676;--line:#D5D9D1;--soft:#E3E7DF;--accent:#F2B01E;--onaccent:#1B2333;--pos:#2B7A4B;--neg:#B63F2E;--info:#2A5A9C;--warn:#8F6200;--head:#1B2333;--headink:#E8EBF0;
  --f-head:'Barlow Condensed','Arial Narrow',sans-serif;--f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#141922;--surface:#1C2330;--ink:#E8ECF2;--muted:#9AA3B3;--line:#2D3647;--soft:#252D3C;--pos:#5DC088;--neg:#E8826F;--info:#82ADE3;--warn:#E5B24A;--head:#0F131A}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-body);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--f-head);margin:0;line-height:1.1}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{background:var(--head);color:var(--headink);padding:calc(14px + env(safe-area-inset-top)) 0 16px}
header .co{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;opacity:.9}
header .co img{height:30px;max-width:80px;object-fit:contain;background:#fff;border-radius:6px;padding:2px}
header h1{font-size:30px;margin-top:10px;color:#fff}
header .sub{color:#B7BFCC;font-size:15px;margin-top:2px}
.lock{float:right;border:1px solid #3a4558;background:none;color:#B7BFCC;border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}
.tape{height:8px;background:repeating-linear-gradient(90deg,var(--accent) 0 18px,#1B2333 18px 20px)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="true"]{color:var(--ink)}
nav.tabs button[aria-current="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--accent)}
.bdg{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:99px;background:var(--neg);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
main.wrap{padding-top:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.ph h2{font-size:23px}
.pad{padding:16px}
.muted{color:var(--muted)}.pos{color:var(--pos)}.neg{color:var(--neg)}.num{font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:13px;font-weight:600;border-radius:99px;padding:2px 10px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--pos)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--neg)}.chip.info{color:var(--info)}.chip.mute{color:var(--muted)}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 16px;color:inherit}
.item:first-child{border-top:0}.item .t{font-weight:600}.item .s{font-size:14px;color:var(--muted)}
button.item{cursor:pointer}
.item .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn.block{width:100%}.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:20px;height:20px}
.big{width:100%;min-height:76px;font-size:22px;font-family:var(--f-head);letter-spacing:.02em;border-radius:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15.5px;margin:0}.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:500}
label.f{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:12px}
label.f input,label.f select,textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:17px}
.metric{display:grid;grid-template-columns:1fr 1fr}.metric>div{padding:12px 16px}.metric>div+div{border-left:1px solid var(--line)}
.metric .k{font-size:13.5px;color:var(--muted)}.metric .v{font-family:var(--f-head);font-size:clamp(20px,6vw,28px);font-weight:700;overflow-wrap:anywhere}
.today{display:flex;gap:10px;margin-bottom:14px}.today>div{flex:1;background:var(--soft);border-radius:12px;padding:10px 12px}
.today small{display:block;color:var(--muted);font-size:13px}.today b{font-family:var(--f-head);font-size:26px}
.step{border:2px dashed var(--line);border-radius:12px;padding:14px;margin-top:12px}
.step.ok{border-color:var(--pos);border-style:solid}.step.bad{border-color:var(--neg);border-style:solid}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.ph-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.chat{display:flex;flex-direction:column;gap:8px;padding:14px 12px;min-height:40vh}
.cm{max-width:82%;padding:9px 12px;border-radius:12px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.cm small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.cm.out{align-self:flex-end;background:color-mix(in srgb,var(--accent) 24%,var(--surface));border-bottom-right-radius:4px}
.cm.in{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.cm img{display:block;max-width:220px;max-height:220px;border-radius:8px;margin:4px 0}
.chatbar{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
.chatbar textarea{margin:0;min-height:46px;max-height:120px;resize:none}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:46px;height:46px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}.ibtn svg{width:22px;height:22px}
.ibtn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:14px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.sheet-h h2{font-size:24px}
.x{border:0;background:none;font-size:28px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:7px 4px;border-bottom:1px solid var(--line)}.r{text-align:right}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}.toast.on{opacity:1}
.dead{max-width:420px;margin:18vh auto 0;text-align:center;padding:0 20px}.dead h1{font-size:30px;margin-bottom:8px}
.pinbox{max-width:340px;margin:12vh auto 0;padding:0 20px;text-align:center}
.pinbox h1{font-size:30px}.pindots{display:flex;justify-content:center;gap:14px;margin:22px 0}
.pindots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink)}.pindots i.on{background:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:26px;font-weight:600;cursor:pointer}
.loading{padding:30vh 0;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="root"><div class="loading">Memuat…</div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" accept="image/*" capture="user" id="selfie" hidden>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MS=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'],ML=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const fmtD=s=>{if(!s)return '-';const [y,m,d]=s.split('-').map(Number);return d+' '+MS[m-1]+' '+y};
const fmtM=s=>{if(!s)return '-';const [y,m]=s.split('-').map(Number);return ML[m-1]+' '+y};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());const addDays=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return iso(new Date(y,m-1,d+n))};
const tsMs=v=>v&&v.toMillis?v.toMillis():(v&&v.seconds?v.seconds*1000:(typeof v==='number'?v:Date.now()));
const hm=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const fmtT=ms=>{const t=iso(new Date(ms));return (t===today()?'Hari ini':fmtD(t))+' '+hm(ms)};
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let toastT;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3000)};
const IC={clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',task:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 14l2 2 4-4"/>',wallet:'<path d="M3 7h16a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2zM3 7l2-3h12M16 14h2"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>',send:'<path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/>',img:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/>',cam:'<path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/>',pin:'<path d="M12 21s-7-6.5-7-12a7 7 0 0114 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const chip=(t,tone)=>`<span class="chip ${tone}">${esc(t)}</span>`;
const unitL=u=>u===0?'Tidak masuk':u===0.5?'½ hari':u===1?'Hadir':u===1.5?'Lembur':u+' hari';

const T=decodeURIComponent((location.hash||'').slice(1)).trim();
let D=null,TAB=ls.get('zk-wt-'+T)||'absen',CHK=[],REP=[],REQ=[],MSG=[],GEO=null,BUSY=false,CIMG='',RPH=[],TPH={},subs=[],PINOK=false,PIN='',fails=0,lockUntil=0;
const money=n=>{const c=(D&&D.co.cur)||'IDR';try{return new Intl.NumberFormat('id-ID',{style:'currency',currency:c,maximumFractionDigits:c==='IDR'?0:2}).format(+n||0)}catch(e){return c+' '+(+n||0)}};
function dead(msg){document.title='Link tidak aktif';subs.forEach(f=>f());subs=[];$('#root').innerHTML=`<div class="dead"><h1>Link tidak aktif</h1><p class="muted">${esc(msg||'Link ini sudah dimatikan atau tidak ditemukan. Hubungi admin kantor untuk mendapatkan link yang baru.')}</p></div>`;document.body.style.paddingBottom='0'}
if(!window.firebase||!window.MANDOR_CONFIG||!window.MANDOR_CONFIG.firebase){dead('Halaman ini belum dikonfigurasi.');return}
if(!T||T.length<16){dead();return}
firebase.initializeApp(window.MANDOR_CONFIG.firebase);
const db=firebase.firestore(),TS=()=>firebase.firestore.FieldValue.serverTimestamp(),ref=db.collection('wshares').doc(T);
const sha=async s=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};

ref.onSnapshot(d=>{
  const x=d.exists?d.data():null;
  if(!x||!x.active){D=null;dead();return}
  D=x;document.title=D.w.name+' · '+D.co.name;
  PINOK=!D.pinHash||ls.get('zk-wp-'+T)===D.pinHash;
  if(!PINOK){showPin();return}
  if(!subs.length)startSubs();
  render();
},()=>dead('Tidak bisa memuat data. Periksa koneksi internet lalu muat ulang halaman.'));

function startSubs(){
  const since=addDays(today(),-14),map=s=>s.docs.map(d=>Object.assign({id:d.id},d.data({serverTimestamps:'estimate'})));
  subs.push(ref.collection('checks').where('date','>=',since).onSnapshot(s=>{CHK=map(s).filter(c=>c.date>=since);if(TAB==='absen'&&!BUSY)render()},()=>{}));
  subs.push(ref.collection('reports').where('date','>=',since).onSnapshot(s=>{REP=map(s).filter(c=>c.date>=since);if(TAB==='tugas')render()},()=>{}));
  subs.push(ref.collection('reqs').onSnapshot(s=>{REQ=map(s).sort((a,b)=>tsMs(b.ts)-tsMs(a.ts)).slice(0,20);if(TAB==='upah')render()},()=>{}));
  subs.push(ref.collection('msgs').onSnapshot(s=>{MSG=map(s).map(m=>Object.assign(m,{ts:tsMs(m.ts)})).sort((a,b)=>a.ts-b.ts);if(TAB==='chat'){ls.set('zk-wr-'+T,String(Date.now()));renderChat()}else if(!BUSY)render()},()=>{}));
}

/* ---------- PIN ---------- */
function showPin(){
  document.body.style.paddingBottom='0';
  $('#root').innerHTML=`<div class="pinbox"><div class="muted">${esc(D.co.name)}</div><h1>Halo, ${esc(D.w.name)}</h1><p class="muted">Masukkan PIN 4 angka dari admin</p><div class="pindots">${[0,1,2,3].map(i=>`<i class="${PIN.length>i?'on':''}"></i>`).join('')}</div><div class="keys">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-key="${k}" aria-label="${k==='⌫'?'Hapus':k}">${k}</button>`).join('')}</div><p class="muted" id="pinmsg" style="min-height:24px;margin-top:14px"></p></div>`;
}
async function pinKey(k){
  if(Date.now()<lockUntil){$('#pinmsg').textContent='Terlalu banyak percobaan. Tunggu sebentar.';return}
  if(k==='⌫')PIN=PIN.slice(0,-1);else if(PIN.length<4)PIN+=k;
  document.querySelectorAll('.pindots i').forEach((el,i)=>el.classList.toggle('on',PIN.length>i));
  if(PIN.length<4)return;
  const h=await sha(T+':'+PIN);PIN='';
  if(h===D.pinHash){ls.set('zk-wp-'+T,h);PINOK=true;document.body.style.paddingBottom='';startSubs();render();return}
  fails++;if(fails>=5){lockUntil=Date.now()+60000;fails=0}
  showPin();$('#pinmsg').textContent='PIN salah. Coba lagi.';
}

/* ---------- tampilan ---------- */
const todayChecks=()=>CHK.filter(c=>c.date===today());
const stLabel=c=>c.status==='ok'?chip('Dikonfirmasi','ok'):c.status==='no'?chip('Ditolak','bad'):chip('Menunggu konfirmasi','warn');
const unread=()=>{const lr=+ls.get('zk-wr-'+T)||0;return MSG.filter(m=>m.from==='team'&&m.ts>lr).length};
function render(){
  if(!D||!PINOK)return;
  const tabs=[['absen','Absen','clock'],['tugas','Tugas','task'],['upah','Upah','wallet'],['chat','Chat','chat']],un=unread();
  $('#root').innerHTML=`<header><div class="wrap"><button class="lock" data-lock>Kunci</button><div class="co">${D.co.logo?`<img src="${esc(D.co.logo)}" alt="">`:''}<span>${esc(D.co.name)}</span></div><h1>${esc(D.w.name)}</h1><div class="sub">${esc(D.w.role||'Pekerja')}</div></div></header><div class="tape"></div><main class="wrap" id="view"></main>
  <nav class="tabs">${tabs.map(([k,l,i])=>`<button data-tab="${k}" aria-current="${TAB===k}">${ic(i)}${l}${k==='chat'&&un?`<span class="bdg">${un}</span>`:''}</button>`).join('')}</nav>`;
  ({absen:vAbsen,tugas:vTugas,upah:vUpah,chat:vChat})[TAB]();
}
function projOpts(sel){return D.projects.map(p=>`<option value="${esc(p.id)}"${p.id===sel?' selected':''}>${esc(p.name)}</option>`).join('')}
function vAbsen(){
  const tc=todayChecks(),i=tc.find(c=>c.type!=='out'&&c.status!=='no'),o=tc.find(c=>c.type==='out'&&c.status!=='no');
  const next=!i?'in':!o?'out':null,pid=ls.get('zk-wpj-'+T)||(i&&i.pid)||(D.projects[0]||{}).id||'';
  const p=D.projects.find(x=>x.id===pid);
  const hist=[...new Set([...CHK.map(c=>c.date),...D.att.map(a=>a.date)])].filter(d=>d!==today()).sort().reverse().slice(0,10).map(d=>{const a=D.att.find(x=>x.date===d),cs=CHK.filter(c=>c.date===d),ci=cs.find(c=>c.type!=='out'),co=cs.find(c=>c.type==='out');
    return `<div class="item"><div><div class="t">${fmtD(d)}</div><div class="s">${ci?'Masuk '+hm(tsMs(ci.ts)):a&&a.inT?'Masuk '+a.inT:''}${co?' · Pulang '+hm(tsMs(co.ts)):a&&a.outT?' · Pulang '+a.outT:''}${a&&a.proj?' · '+esc(a.proj):''}</div></div><div class="r">${a?chip(a.note||unitL(a.units),a.units>0?'ok':'mute'):ci?stLabel(ci):''}</div></div>`}).join('');
  $('#view').innerHTML=`<div class="panel"><div class="ph"><h2>Absen hari ini</h2><span class="muted" style="font-size:14px">${fmtD(today())}</span></div><div class="pad">
    <div class="today"><div><small>Masuk</small><b>${i?hm(tsMs(i.ts)):'--:--'}</b><div>${i?stLabel(i):''}</div></div><div><small>Pulang</small><b>${o?hm(tsMs(o.ts)):'--:--'}</b><div>${o?stLabel(o):''}</div></div></div>
    ${next?`${D.projects.length>1||!i?`<label class="f">Lokasi kerja hari ini<select id="apj" ${i?'disabled':''}>${projOpts(i?i.pid:pid)}</select></label>`:''}
      ${GEO&&GEO.next===next?geoStep():`<button class="btn primary big" data-absen="${next}">${ic('pin')} Absen ${next==='in'?'Masuk':'Pulang'}</button>
      <p class="muted" style="font-size:14px;margin:10px 0 0">${p&&p.geo?`Pastikan Anda berada di lokasi proyek (maks. ${p.geo.r} m). `:''}Anda akan diminta mengizinkan lokasi lalu mengambil foto selfie.</p>`}`
      :`<p style="margin:0;text-align:center" class="pos"><b>Absen hari ini sudah lengkap. Terima kasih!</b></p>`}
  </div></div>
  <div class="panel"><div class="ph"><h2>Riwayat absen</h2></div>${hist||'<div class="empty">Belum ada riwayat.</div>'}</div>`;
}
function geoStep(){
  const g=GEO;
  if(g.state==='wait')return `<div class="step"><b>Mengambil lokasi…</b><p class="muted" style="margin:4px 0 0;font-size:14px">Izinkan akses lokasi jika diminta.</p></div>`;
  if(g.state==='bad')return `<div class="step bad"><b class="neg">${esc(g.msg)}</b><div class="btns"><button class="btn" data-geo-cancel>Batal</button><button class="btn primary" data-absen="${g.next}">Coba lagi</button></div></div>`;
  return `<div class="step ok"><b class="pos">✓ ${esc(g.msg)}</b><p class="muted" style="font-size:14px;margin:4px 0 12px">Sekarang ambil foto selfie untuk menyelesaikan absen ${g.next==='in'?'masuk':'pulang'}.</p><label class="btn primary big" for="selfie">${ic('cam')} Ambil selfie</label><div class="btns"><button class="btn" data-geo-cancel>Batal</button></div></div>`;
}
const dist=(a,b,c,d)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
function startGeo(next){
  const sel=$('#apj'),i=todayChecks().find(c=>c.type!=='out'&&c.status!=='no'),pid=(next==='out'&&i)?i.pid:(sel?sel.value:(D.projects[0]||{}).id||'');
  if(sel&&next==='in')ls.set('zk-wpj-'+T,pid);
  const p=D.projects.find(x=>x.id===pid)||null;
  GEO={next,pid,pname:p?p.name:'',state:'wait'};BUSY=true;render();
  if(!navigator.geolocation){GEO.state='bad';GEO.msg='HP ini tidak mendukung lokasi.';render();return}
  navigator.geolocation.getCurrentPosition(pos=>{
    const c=pos.coords;Object.assign(GEO,{lat:+c.latitude.toFixed(6),lng:+c.longitude.toFixed(6),acc:Math.round(c.accuracy||0)});
    if(p&&p.geo){const m=dist(c.latitude,c.longitude,p.geo.lat,p.geo.lng);GEO.dist=Math.round(m);
      if(m-Math.min(GEO.acc,100)>p.geo.r){GEO.state='bad';GEO.msg=`Anda berada ±${Math.round(m)} m dari lokasi proyek (batas ${p.geo.r} m). Absen hanya bisa di lokasi proyek.`;GEO.far=true}
      else{GEO.state='ok';GEO.msg=`Lokasi sesuai (±${Math.round(m)} m dari proyek)`;GEO.far=false}}
    else{GEO.dist=-1;GEO.far=false;GEO.state='ok';GEO.msg='Lokasi tercatat'}
    render()},
  err=>{GEO.state='bad';GEO.msg=err&&err.code===1?'Akses lokasi ditolak. Izinkan lokasi untuk situs ini di pengaturan browser, lalu coba lagi.':'Lokasi tidak bisa diambil. Nyalakan GPS lalu coba lagi.';render()},
  {enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
async function sendCheck(img){
  const g=GEO;if(!g||g.state!=='ok')return;
  try{await ref.collection('checks').add({type:g.next,date:today(),ts:TS(),lat:g.lat,lng:g.lng,acc:g.acc,dist:g.dist,far:!!g.far,pid:g.pid||'',pname:(g.pname||'').slice(0,120),selfie:img,status:'wait'});
    GEO=null;BUSY=false;toast(`Absen ${g.next==='in'?'masuk':'pulang'} terkirim. Menunggu konfirmasi mandor.`);render()}
  catch(e){toast('Gagal mengirim absen. Periksa koneksi lalu coba lagi.')}
}
function vTugas(){
  const sent=k=>ls.get('zk-wtk-'+T+'-'+k);
  const tasks=D.tasks.slice().sort((a,b)=>(a.status==='done')-(b.status==='done')||(a.due||'9').localeCompare(b.due||'9'));
  const lastPid=ls.get('zk-wpj-'+T)||(D.projects[0]||{}).id||'';
  $('#view').innerHTML=`<div class="panel"><div class="ph"><h2>Tugas saya</h2></div>${tasks.length?tasks.map(t=>{const s=sent(t.id+'-'+t.status),late=t.status!=='done'&&t.due&&t.due<today();
    return `<div class="item" style="flex-wrap:wrap"><div style="flex:1;min-width:0"><div class="t">${esc(t.title)}</div><div class="s">${esc(t.proj)}${t.due?` · <span class="${late?'neg':''}">${late?'terlambat – ':''}${fmtD(t.due)}</span>`:''}</div>${t.notes?`<div class="s" style="white-space:pre-line;margin-top:4px">${esc(t.notes.slice(-200))}</div>`:''}</div>
    <div class="r">${t.status==='done'?chip('Selesai','ok'):s?chip('Terkirim','info'):t.status==='doing'?`<button class="btn primary" data-task="${esc(t.id)}" data-s="done">Selesai</button>`:`<button class="btn primary" data-task="${esc(t.id)}" data-s="doing">Mulai</button>`}</div></div>`}).join(''):'<div class="empty">Belum ada tugas untuk Anda.</div>'}</div>
  <div class="panel"><div class="ph"><h2>Lapor pekerjaan hari ini</h2></div><form class="pad" id="repform">
    ${D.projects.length?`<label class="f">Proyek<select name="pid">${projOpts(lastPid)}</select></label>`:''}
    <label class="f">Apa yang dikerjakan hari ini?<textarea name="text" rows="3" required placeholder="Contoh: Pasang bata dinding kamar belakang 12 m²"></textarea></label>
    <div id="rph" class="ph-grid"></div>
    <div class="btns" style="justify-content:space-between"><label class="btn">${ic('cam')} Foto (${RPH.length}/3)<input type="file" accept="image/*" id="repPhoto" hidden multiple></label><button class="btn primary" type="submit">${ic('send')} Kirim laporan</button></div>
  </form>${REP.length?REP.slice().sort((a,b)=>tsMs(b.ts)-tsMs(a.ts)).slice(0,6).map(r=>`<div class="item"><div style="min-width:0"><div class="t">${fmtD(r.date)}</div><div class="s">${esc((r.text||'').slice(0,80))}</div></div><div class="r">${r.status==='ok'?chip('Diterima','ok'):r.status==='no'?chip('Tidak dipakai','mute'):chip('Terkirim','info')}</div></div>`).join(''):''}</div>`;
  renderRph();
}
function renderRph(){const el=$('#rph');if(el)el.innerHTML=RPH.map((s,i)=>`<button type="button" data-rph="${i}" style="border:0;padding:0;background:none;position:relative"><img src="${s}" alt=""><span style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px">×</span></button>`).join('')}
function vUpah(){
  const m=D.w.type==='monthly',pend=REQ.filter(r=>r.status==='wait');
  const att=D.att.slice(0,20).map(a=>`<div class="item"><div><div class="t">${fmtD(a.date)}</div><div class="s">${esc(a.note||unitL(a.units))}${a.proj?' · '+esc(a.proj):''}</div></div><div class="r">${m?'':`<b class="num">${money(a.amt)}</b>`}${a.paid?chip('Dibayar','ok'):a.units>0&&!m?chip('Belum dibayar','warn'):''}</div></div>`).join('');
  const thisM=D.att.filter(a=>a.date.startsWith(today().slice(0,7))&&a.units>0).length;
  $('#view').innerHTML=`<div class="panel"><div class="metric">${m?`<div><div class="k">Gaji pokok</div><div class="v num">${money(D.w.base)}</div></div><div><div class="k">Hadir bulan ini</div><div class="v num">${thisM} hari</div></div>`:`<div><div class="k">Upah belum dibayar</div><div class="v num">${money(D.unpaid.amt)}</div><div class="muted" style="font-size:13.5px">${D.unpaid.days} hari kerja</div></div><div><div class="k">Upah harian</div><div class="v num">${money(D.w.rate)}</div></div>`}</div>
    <div class="metric" style="border-top:1px solid var(--line)"><div><div class="k">Sisa kasbon</div><div class="v num ${D.kasbon.bal>0?'neg':''}">${money(D.kasbon.bal)}</div></div><div style="display:flex;flex-direction:column;gap:6px;justify-content:center"><button class="btn" data-req="kasbon">Ajukan kasbon</button><button class="btn" data-req="izin">Ajukan izin / sakit</button></div></div></div>
  ${REQ.length?`<div class="panel"><div class="ph"><h2>Pengajuan saya</h2></div>${REQ.slice(0,8).map(r=>`<div class="item"><div><div class="t">${r.type==='kasbon'?'Kasbon '+money(r.amount):r.type==='sakit'?'Izin sakit':'Izin tidak masuk'}</div><div class="s">${fmtD(r.date)}${r.reply?' · '+esc(r.reply):''}</div></div><div class="r">${r.status==='ok'?chip('Disetujui','ok'):r.status==='no'?chip('Ditolak','bad'):chip('Menunggu','warn')}</div></div>`).join('')}</div>`:''}
  <div class="panel"><div class="ph"><h2>Slip ${m?'gaji':'upah'}</h2></div>${D.slips.length?D.slips.map(s=>`<button class="item" data-slip="${esc(s.id)}"><div><div class="t">${s.kind==='m'?'Gaji '+fmtM(s.period):fmtD(s.from)+' – '+fmtD(s.to)}</div><div class="s">${esc(s.no)} · dibayar ${fmtD(s.date)}</div></div><div class="r"><b class="num">${money(s.amount)}</b></div></button>`).join(''):'<div class="empty">Belum ada slip.</div>'}</div>
  <div class="panel"><div class="ph"><h2>Kehadiran 45 hari terakhir</h2></div>${att||'<div class="empty">Belum ada data kehadiran.</div>'}</div>
  ${D.kasbon.list.length?`<div class="panel"><div class="ph"><h2>Riwayat kasbon</h2></div>${D.kasbon.list.map(k=>`<div class="item"><div><div class="t">${fmtD(k.date)}</div><div class="s">${esc(k.note||'')}${k.bal>0?' · sisa '+money(k.bal):' · lunas'}</div></div><b class="num">${money(k.amount)}</b></div>`).join('')}</div>`:''}`;
}
function vChat(){
  ls.set('zk-wr-'+T,String(Date.now()));
  $('#view').innerHTML=`<div class="panel" style="margin-bottom:0"><div class="ph"><h2>Chat dengan kantor</h2></div><div class="chat" id="chat"></div>
  <form class="chatbar" id="chatform"><label class="ibtn" aria-label="Kirim foto">${ic('img')}<input type="file" accept="image/*" id="cphoto" hidden></label><div style="flex:1"><div id="cimg"></div><textarea name="text" rows="1" placeholder="Tulis pesan…" aria-label="Pesan"></textarea></div><button class="ibtn primary" type="submit" aria-label="Kirim">${ic('send')}</button></form></div>`;
  renderChat();
}
function renderChat(){
  const el=$('#chat');if(!el)return;
  el.innerHTML=MSG.length?MSG.map(m=>`<div class="cm ${m.from==='worker'?'out':'in'}"><small>${esc(m.from==='worker'?'Anda':(m.name||D.co.name))} · ${fmtT(m.ts)}</small>${m.img?`<img src="${esc(m.img)}" alt="Foto">`:''}${m.text?`<div>${esc(m.text)}</div>`:''}</div>`).join(''):'<div class="empty">Belum ada pesan. Tanyakan apa saja ke kantor di sini.</div>';
  window.scrollTo(0,document.body.scrollHeight);
}
function sheet(title,body){closeSheet();const s=document.createElement('div');s.className='scrim';s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><h2>${esc(title)}</h2><button class="x" data-close aria-label="Tutup">×</button></div>${body}</div>`;document.body.appendChild(s);document.body.style.overflow='hidden'}
function closeSheet(){document.querySelectorAll('.scrim').forEach(x=>x.remove());document.body.style.overflow=''}
function openSlip(id){
  const s=D.slips.find(x=>x.id===id);if(!s)return;
  const rows=s.kind==='m'?`<tr><td colspan="2"><b>Pendapatan</b></td></tr>${s.inc.map(x=>`<tr><td>${esc(x.n)}</td><td class="r">${money(x.a)}</td></tr>`).join('')}<tr><td><b>Total pendapatan</b></td><td class="r"><b>${money(s.gross)}</b></td></tr><tr><td colspan="2"><b>Potongan</b></td></tr>${s.ded.map(x=>`<tr><td>${esc(x.n)}</td><td class="r">-${money(x.a)}</td></tr>`).join('')}${s.kasbon?`<tr><td>Potongan kasbon</td><td class="r">-${money(s.kasbon)}</td></tr>`:''}`
    :`<tr><td>Hari kerja</td><td class="r">${s.days} hari</td></tr><tr><td>Periode</td><td class="r">${fmtD(s.from)} – ${fmtD(s.to)}</td></tr><tr><td>Total upah</td><td class="r">${money(s.gross)}</td></tr>${s.kasbon?`<tr><td>Potongan kasbon</td><td class="r">-${money(s.kasbon)}</td></tr>`:''}`;
  sheet(s.kind==='m'?'Slip gaji '+fmtM(s.period):'Slip upah',`<dl class="kv"><dt>Nomor</dt><dd>${esc(s.no)}</dd><dt>Nama</dt><dd>${esc(D.w.name)}</dd><dt>Dibayar</dt><dd>${fmtD(s.date)} · ${esc(s.method)}</dd>${s.kind==='m'?`<dt>Kehadiran</dt><dd>${s.days} hari</dd>`:''}</dl><table style="margin-top:12px">${rows}<tr><td><b style="font-size:18px">Diterima</b></td><td class="r"><b style="font-size:18px">${money(s.amount)}</b></td></tr></table><p class="muted" style="font-size:13px">${esc(D.co.name)}</p>`);
}
function reqForm(type){
  sheet(type==='kasbon'?'Ajukan kasbon':'Ajukan izin / sakit',`<form id="reqform" data-type="${type}">${type==='kasbon'?`<label class="f">Jumlah<input name="amount" type="number" min="1" inputmode="numeric" required></label>`:`<label class="f">Jenis<select name="kind"><option value="izin">Izin tidak masuk</option><option value="sakit">Sakit</option></select></label><label class="f">Tanggal<input name="date" type="date" value="${today()}" required></label>`}<label class="f">Keterangan<textarea name="note" rows="2" placeholder="${type==='kasbon'?'Contoh: keperluan sekolah anak':'Contoh: ada acara keluarga'}"></textarea></label><button class="btn primary block" type="submit">Kirim pengajuan</button></form>`);
}
function shrink(file,max=900,q=.6){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

/* ---------- interaksi ---------- */
document.addEventListener('click',async e=>{
  const t=e.target;if(t.classList&&t.classList.contains('scrim')){closeSheet();return}
  const el=t.closest('[data-key],[data-tab],[data-absen],[data-geo-cancel],[data-task],[data-req],[data-slip],[data-close],[data-lock],[data-rph]');if(!el)return;
  if(el.dataset.key!==undefined){pinKey(el.dataset.key);return}
  if(el.dataset.tab){TAB=el.dataset.tab;ls.set('zk-wt-'+T,TAB);GEO=null;BUSY=false;closeSheet();render();window.scrollTo(0,TAB==='chat'?document.body.scrollHeight:0);return}
  if(el.dataset.absen){startGeo(el.dataset.absen);return}
  if('geoCancel' in el.dataset){GEO=null;BUSY=false;render();return}
  if(el.dataset.task){const id=el.dataset.task,s=el.dataset.s;
    if(s==='done'){sheet('Tugas selesai',`<form id="taskform" data-id="${esc(id)}"><label class="f">Catatan (opsional)<textarea name="note" rows="2"></textarea></label><label class="btn block" style="margin-bottom:10px">${ic('cam')} Foto hasil (opsional)<input type="file" accept="image/*" id="taskPhoto" hidden></label><div id="tph" style="margin-bottom:10px"></div><button class="btn primary block" type="submit">Tandai selesai</button></form>`);return}
    try{await ref.collection('taskups').add({taskId:id,status:'doing',note:'',photo:'',ts:TS()});ls.set('zk-wtk-'+T+'-'+id+'-'+D.tasks.find(x=>x.id===id).status,'1');toast('Tugas dimulai');render()}catch(x){toast('Gagal mengirim. Periksa koneksi.')}return}
  if(el.dataset.req){reqForm(el.dataset.req);return}
  if(el.dataset.slip){openSlip(el.dataset.slip);return}
  if('close' in el.dataset){closeSheet();return}
  if('lock' in el.dataset){ls.del('zk-wp-'+T);location.reload();return}
  if(el.dataset.rph!==undefined){RPH.splice(+el.dataset.rph,1);vTugas();return}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='selfie'&&t.files[0]){const f=t.files[0];t.value='';let img;try{img=await shrink(f,640,.55)}catch(x){return toast('Foto tidak bisa dibaca')}sendCheck(img);return}
  if(t.id==='repPhoto'&&t.files.length){for(const f of [...t.files].slice(0,3-RPH.length)){try{RPH.push(await shrink(f,900,.55))}catch(x){}}t.value='';const txt=($('#repform [name=text]')||{}).value||'';vTugas();$('#repform [name=text]').value=txt;return}
  if(t.id==='taskPhoto'&&t.files[0]){try{TPH.img=await shrink(t.files[0],900,.55);$('#tph').innerHTML=`<img src="${TPH.img}" alt="" style="max-height:120px;border-radius:8px">`}catch(x){}t.value='';return}
  if(t.id==='cphoto'&&t.files[0]){try{CIMG=await shrink(t.files[0],1000,.6)}catch(x){}t.value='';const b=$('#cimg');if(b)b.innerHTML=CIMG?`<img src="${CIMG}" alt="" style="max-height:80px;border-radius:8px;display:block;margin-bottom:6px">`:'';return}
});
document.addEventListener('submit',async e=>{
  const f=e.target;e.preventDefault();const btn=f.querySelector('[type=submit]');if(btn)btn.disabled=true;
  try{
    if(f.id==='chatform'){const text=(f.text.value||'').trim();if(!text&&!CIMG)return;await ref.collection('msgs').add({from:'worker',name:D.w.name.slice(0,80),text:text.slice(0,2000),img:CIMG||'',ts:TS()});f.text.value='';CIMG='';$('#cimg').innerHTML=''}
    else if(f.id==='repform'){const text=(f.text.value||'').trim();if(!text)return;const pid=f.pid?f.pid.value:'',p=D.projects.find(x=>x.id===pid);
      await ref.collection('reports').add({date:today(),pid,pname:p?p.name.slice(0,120):'',text:text.slice(0,2000),photos:RPH.slice(0,3),ts:TS(),status:'wait'});RPH=[];toast('Laporan terkirim. Terima kasih!');vTugas()}
    else if(f.id==='taskform'){const id=f.dataset.id;await ref.collection('taskups').add({taskId:id,status:'done',note:(f.note.value||'').trim().slice(0,500),photo:TPH.img||'',ts:TS()});TPH={};ls.set('zk-wtk-'+T+'-'+id+'-'+D.tasks.find(x=>x.id===id).status,'1');closeSheet();toast('Tugas ditandai selesai');render()}
    else if(f.id==='reqform'){const ty=f.dataset.type==='kasbon'?'kasbon':f.kind.value;await ref.collection('reqs').add({type:ty,amount:ty==='kasbon'?(+f.amount.value||0):0,date:f.date?f.date.value:today(),note:(f.note.value||'').trim().slice(0,500),ts:TS(),status:'wait'});closeSheet();toast('Pengajuan terkirim. Menunggu persetujuan.');render()}
  }catch(x){toast('Gagal mengirim. Periksa koneksi internet lalu coba lagi.')}
  finally{if(btn)btn.disabled=false}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
window.addEventListener('hashchange',()=>location.reload());
})();
</script>
